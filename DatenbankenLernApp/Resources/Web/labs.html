<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="claude:viewport-fit-sides" content="cover"><title>Labor</title><style>/* Layout: wie die iOS-App. Tabs unten auf dem Handy, linke Leiste ab 960 px; Glaskarten über langsam treibenden Farbflächen.
   Farben stammen aus Theme.swift der Netztechnik-App, damit HTML und App gleich aussehen. */
:root {
  --bg: #eaeff7;
  --fg: #101a2c;
  --muted: #55627a;
  --faint: #7c889e;
  --line: rgba(16, 26, 44, .13);
  --glass: rgba(255, 255, 255, .7);
  --solid: #ffffff;
  --soft: rgba(16, 26, 44, .055);
  --softer: rgba(16, 26, 44, .03);
  --primary: #1a6bc7;
  --on-primary: #ffffff;
  --good: #16845a;
  --bad: #c9353b;
  --warn: #a96a06;
  --violet: #6a48c9;
  --teal: #0f7f8c;
  --primary-soft: rgba(26, 107, 199, .13);
  --good-soft: rgba(22, 132, 90, .15);
  --bad-soft: rgba(201, 53, 59, .13);
  --warn-soft: rgba(237, 153, 33, .17);
  --violet-soft: rgba(106, 72, 201, .12);
  --teal-soft: rgba(15, 127, 140, .13);
  --blob-a: rgba(26, 107, 199, .3);
  --blob-b: rgba(120, 87, 209, .26);
  --blob-c: rgba(26, 153, 166, .26);
  --shadow: 0 1px 2px rgba(16, 26, 44, .06), 0 8px 24px rgba(16, 26, 44, .06);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --math: "Cambria Math", "STIX Two Math", "Times New Roman", serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, Menlo, monospace;
  --radius: 20px;
  --radius-s: 13px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a101c; --fg: #e8eef8; --muted: #a2afc6; --faint: #7e8ba3; --line: rgba(232, 238, 248, .15);
    --glass: rgba(24, 33, 50, .72); --solid: #182132; --soft: rgba(232, 238, 248, .08); --softer: rgba(232, 238, 248, .04);
    --primary: #5aa2f2; --on-primary: #06121f; --good: #3fc690; --bad: #f2777c; --warn: #eab052; --violet: #a68df0; --teal: #4cc3cf;
    --primary-soft: rgba(90, 162, 242, .17); --good-soft: rgba(63, 198, 144, .16); --bad-soft: rgba(242, 119, 124, .16);
    --warn-soft: rgba(234, 176, 82, .15); --violet-soft: rgba(166, 141, 240, .16); --teal-soft: rgba(76, 195, 207, .15);
    --blob-a: rgba(26, 107, 199, .38); --blob-b: rgba(120, 87, 209, .34); --blob-c: rgba(26, 153, 166, .3);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a101c; --fg: #e8eef8; --muted: #a2afc6; --faint: #7e8ba3; --line: rgba(232, 238, 248, .15);
  --glass: rgba(24, 33, 50, .72); --solid: #182132; --soft: rgba(232, 238, 248, .08); --softer: rgba(232, 238, 248, .04);
  --primary: #5aa2f2; --on-primary: #06121f; --good: #3fc690; --bad: #f2777c; --warn: #eab052; --violet: #a68df0; --teal: #4cc3cf;
  --primary-soft: rgba(90, 162, 242, .17); --good-soft: rgba(63, 198, 144, .16); --bad-soft: rgba(242, 119, 124, .16);
  --warn-soft: rgba(234, 176, 82, .15); --violet-soft: rgba(166, 141, 240, .16); --teal-soft: rgba(76, 195, 207, .15);
  --blob-a: rgba(26, 107, 199, .38); --blob-b: rgba(120, 87, 209, .34); --blob-c: rgba(26, 153, 166, .3);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 var(--sans);
  overflow-x: hidden;
}
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 650; }
p { margin: 0; }
a { color: var(--primary); }
code { font: .92em var(--mono); background: var(--soft); padding: .08em .35em; border-radius: 6px; }
u { text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
sub { font-size: .72em; line-height: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--muted); }
.small { font-size: .84rem; }
.tiny { font-size: .75rem; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stack-s { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

/* Treibende Farbflächen hinter dem Glas */
#bg { position: fixed; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; background: var(--bg); }
#bg i { position: absolute; display: block; border-radius: 50%; filter: blur(70px); width: 70vmax; height: 70vmax; animation: drift 28s ease-in-out infinite alternate; }
#bg i:nth-child(1) { background: var(--blob-a); left: -22vmax; top: -30vmax; }
#bg i:nth-child(2) { background: var(--blob-b); right: -26vmax; top: 18vh; animation-delay: -9s; }
#bg i:nth-child(3) { background: var(--blob-c); left: -10vmax; bottom: -38vmax; animation-delay: -17s; }
@keyframes drift { from { transform: translate3d(-3vmax, -2vmax, 0); } to { transform: translate3d(5vmax, 4vmax, 0); } }

/* Grundgerüst */
#shell { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
#view {
  width: 100%;
  max-width: 780px;
  margin: 0 auto;
  padding-top: calc(18px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}
#tabs {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 20;
  display: flex;
  justify-content: space-around;
  gap: 2px;
  padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  backdrop-filter: blur(22px) saturate(160%);
  border-top: 1px solid var(--line);
}
#tabs button {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 5px 2px;
  border: 0;
  border-radius: 12px;
  background: none;
  color: var(--muted);
  font-size: .68rem;
  font-weight: 600;
  position: relative;
}
#tabs button svg { width: 23px; height: 23px; }
#tabs button.on { color: var(--primary); background: var(--primary-soft); }
#tabs .badge { position: absolute; top: 1px; left: calc(50% + 7px); min-width: 17px; padding: 0 4px; border-radius: 9px; background: var(--bad); color: #fff; font-size: .66rem; line-height: 17px; font-variant-numeric: tabular-nums; }
#tabs .brand { display: none; }
@media (min-width: 960px) {
  #shell { grid-template-columns: 208px minmax(0, 1fr); }
  #tabs {
    position: sticky; top: 0; bottom: auto; left: auto; right: auto;
    height: 100vh;
    flex-direction: column;
    justify-content: flex-start;
    gap: 4px;
    padding: 22px 12px;
    border-top: 0;
    border-right: 1px solid var(--line);
  }
  #tabs .brand { display: block; padding: 0 10px 14px; font: 700 1.15rem var(--display); }
  #tabs .brand span { display: block; font: 500 .74rem var(--sans); color: var(--muted); margin-top: 2px; }
  #tabs button { flex: 0 0 auto; flex-direction: row; gap: 10px; justify-content: flex-start; padding: 9px 10px; font-size: .92rem; }
  #tabs button svg { width: 20px; height: 20px; }
  #tabs .badge { position: static; margin-left: auto; }
  #view { padding-top: 34px; padding-bottom: 60px; }
}

/* Karten */
.card {
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  backdrop-filter: blur(18px) saturate(150%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  min-width: 0;
}
.card.tight { padding: 12px 14px; }
a.card, button.card { display: block; width: 100%; text-align: left; color: inherit; text-decoration: none; cursor: pointer; transition: transform .12s ease; }
a.card:hover, button.card:hover { transform: translateY(-1px); }
.eyebrow { font-size: .78rem; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.backlink { display: inline-flex; align-items: center; gap: 4px; color: var(--primary); font-weight: 600; font-size: .92rem; background: none; border: 0; padding: 2px 0; }
.title-block { display: flex; flex-direction: column; gap: 3px; }

/* Schaltflächen */
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 7px; min-height: 42px; padding: 8px 18px; border-radius: 999px; border: 1px solid transparent; background: var(--soft); font-weight: 600; text-align: center; }
.btn.pri { background: var(--primary); color: var(--on-primary); }
.btn.line { background: transparent; border-color: var(--line); }
.btn.full { width: 100%; }
.btn.s { min-height: 32px; padding: 3px 12px; font-size: .85rem; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: flex; gap: 3px; padding: 3px; border-radius: 12px; background: var(--soft); }
.seg button { flex: 1; min-width: 0; padding: 6px 8px; border: 0; border-radius: 9px; background: transparent; font-size: .86rem; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--solid); color: var(--fg); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.chip { display: inline-flex; align-items: center; gap: 4px; min-height: 34px; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--softer); font: 600 .9rem var(--mono); }
button.chip:hover { background: var(--soft); }
.chip.on { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
.chip.ok { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.chip.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.chip.key { background: var(--warn-soft); border-color: var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .73rem; font-weight: 700; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.exam { background: var(--violet-soft); color: var(--violet); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

/* Symbole aus der Fachnotation statt Icons */
.glyph { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font: 700 1.2rem var(--math); }
.glyph.big { width: 58px; height: 58px; font-size: 1.55rem; }
.ring { flex: none; display: block; }
.ring circle { fill: none; }
.ring .t { stroke: var(--soft); }
.ring .v { stroke-linecap: round; transition: stroke-dashoffset .6s ease; transform: rotate(-90deg); transform-origin: center; }
.bar { height: 7px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: var(--primary); transition: width .4s ease; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; gap: 1px; }
.tile b { font: 700 1.5rem var(--display); font-variant-numeric: tabular-nums; }

/* Textblöcke */
.blocks { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.prose { line-height: 1.55; }
ul.points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
ul.points li { position: relative; padding-left: 16px; }
ul.points li::before { content: ""; position: absolute; left: 1px; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
.call { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 12px 14px; border-radius: var(--radius-s); }
.call svg { width: 20px; height: 20px; margin-top: 2px; }
.call .tag { display: block; font-size: .73rem; font-weight: 800; letter-spacing: .03em; margin-bottom: 1px; }
.call.k { background: var(--warn-soft); } .call.k svg, .call.k .tag { color: var(--warn); }
.call.w { background: var(--bad-soft); } .call.w svg, .call.w .tag { color: var(--bad); }
.call.ex { background: var(--violet-soft); } .call.ex svg, .call.ex .tag { color: var(--violet); }
.formula { padding: 12px 14px; border-radius: var(--radius-s); background: var(--violet-soft); text-align: center; font: 600 1.14rem/1.45 var(--math); overflow-x: auto; }
.formula small { display: block; margin-top: 3px; font: 400 .78rem var(--sans); color: var(--muted); }
.schema { padding: 11px 13px; border-radius: var(--radius-s); background: var(--teal-soft); font: .88rem/1.65 var(--mono); overflow-x: auto; }
pre.code { margin: 0; padding: 11px 13px; border-radius: var(--radius-s); background: var(--soft); font: .82rem/1.5 var(--mono); overflow-x: auto; white-space: pre; }
h3.sub { padding-top: 6px; }

/* Relationen und Tabellen */
.tb-wrap { overflow-x: auto; min-width: 0; -webkit-overflow-scrolling: touch; }
.tb-title { font-size: .78rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
table.rel { border-collapse: separate; border-spacing: 0; font-size: .87rem; background: var(--solid); border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
table.rel th { text-align: left; padding: 6px 11px; background: var(--primary-soft); color: var(--fg); font-weight: 700; white-space: nowrap; }
table.rel td { padding: 5px 11px; border-top: 1px solid var(--line); vertical-align: top; }
table.rel.data td { font-family: var(--mono); font-size: .83rem; white-space: nowrap; }
table.rel tr.hl td { background: var(--primary-soft); }
table.rel tr.ok td { background: var(--good-soft); }
table.rel tr.bad td { background: var(--bad-soft); }
table.rel tr.warn td { background: var(--warn-soft); }
table.rel tr.dim td { opacity: .32; }
table.rel td.hl, table.rel th.hl { background: var(--primary-soft); }
table.rel td.dim, table.rel th.dim { opacity: .28; }
table.rel td.null { color: var(--bad); font-style: italic; }
table.rel tr.pick { cursor: pointer; }
table.rel tr.pick:hover td { background: var(--soft); }
table.rel tr.pick.on td { background: var(--primary-soft); }
table.rel tr.new td { animation: rowin .45s ease; }
@keyframes rowin { from { background: var(--warn-soft); transform: translateX(-6px); opacity: .2; } to { transform: none; opacity: 1; } }
.rels { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; min-width: 0; }
.rels > div { min-width: 0; max-width: 100%; }

/* Folien */
.slide { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; }
.slide img { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
.slide figcaption, .fig-cap { margin-top: 6px; font-size: .8rem; color: var(--muted); }
#lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(5, 9, 18, .9); overflow: auto; display: flex; flex-direction: column; }
#lightbox .bar-top { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px; color: #fff; font-size: .86rem; background: rgba(5, 9, 18, .7); }
#lightbox .bar-top button { color: #fff; background: rgba(255, 255, 255, .15); border: 0; }
#lightbox img { display: block; margin: auto; max-width: 100%; height: auto; background: #fff; }
#lightbox.zoom img { max-width: none; width: 220%; margin: 0; }

/* Diagramme */
figure.dia { margin: 0; min-width: 0; }
.dia-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.dia-scroll svg { display: block; width: 100%; height: auto; }
.dia-scroll.min svg { min-width: 560px; }
svg text { font-family: var(--sans); fill: currentColor; }
.er-e rect { fill: var(--solid); stroke: currentColor; stroke-width: 1.6; }
.er-r polygon { fill: var(--solid); stroke: currentColor; stroke-width: 1.6; }
.er-a ellipse { fill: var(--solid); stroke: currentColor; stroke-width: 1.1; }
.er-l { stroke: currentColor; stroke-width: 1.2; fill: none; }
.er-c { font-weight: 700; fill: var(--primary); }
.er-step { transition: opacity .4s ease; }
.er-step.off { opacity: 0; pointer-events: none; }
.er-hl rect, .er-hl polygon, .er-hl ellipse { stroke: var(--primary); stroke-width: 2.4; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 6px; }
.stepper button { width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--soft); color: var(--primary); }
.stepper button.play { width: 44px; height: 44px; background: var(--primary); color: var(--on-primary); }
.stepper button svg { width: 18px; height: 18px; }
.stepper button:disabled { opacity: .35; }
.stepper .count { min-width: 42px; text-align: center; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.viz { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: var(--radius); background: var(--glass); border: 1px solid var(--line); box-shadow: var(--shadow); min-width: 0; }
.viz > .viz-title { display: flex; align-items: center; gap: 7px; font: 650 .96rem var(--display); }
.viz > .viz-title svg { width: 18px; height: 18px; color: var(--primary); flex: none; }
.caption { padding: 10px 12px; border-radius: 11px; background: var(--primary-soft); font-size: .92rem; min-width: 0; }
.caption.ok { background: var(--good-soft); }
.caption.bad { background: var(--bad-soft); }
.caption.warn { background: var(--warn-soft); }
.fade-in { animation: fadein .35s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* Fragen */
.q-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .78rem; font-weight: 700; color: var(--primary); }
.q-head .dots3 { margin-left: auto; color: var(--warn); letter-spacing: 1px; font-size: .62rem; }
.q-text { font: 600 1.08rem/1.42 var(--display); }
.opt { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 9px; align-items: start; width: 100%; padding: 11px 12px; border-radius: var(--radius-s); border: 1px solid transparent; background: var(--soft); text-align: left; }
.opt:hover:not(:disabled) { border-color: var(--line); }
.opt svg { width: 20px; height: 20px; color: var(--faint); margin-top: 1px; }
.opt.on { background: var(--primary-soft); } .opt.on svg { color: var(--primary); }
.opt.ok { background: var(--good-soft); } .opt.ok svg { color: var(--good); }
.opt.bad { background: var(--bad-soft); } .opt.bad svg { color: var(--bad); }
.opt:disabled { cursor: default; color: inherit; }
.opts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.tf { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: var(--radius-s); background: var(--soft); }
.tf .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tf .pair button { min-height: 36px; border: 0; border-radius: 999px; background: var(--soft); font-size: .9rem; }
.tf .pair button.on { background: var(--primary-soft); font-weight: 700; }
.tf .pair button.ok { background: var(--good-soft); font-weight: 700; color: var(--good); }
.tf .pair button.bad { background: var(--bad-soft); font-weight: 700; color: var(--bad); }
.ord-item { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 10px; border-radius: 12px; background: var(--soft); }
.ord-item .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); font-size: .78rem; font-weight: 700; }
.ord-item button { width: 30px; height: 30px; border: 0; border-radius: 8px; background: var(--soft); color: var(--primary); }
.ord-item button:disabled { opacity: .3; }
.match-row { display: flex; flex-direction: column; gap: 5px; }
select, input[type=text], input[type=number], textarea {
  width: 100%; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--solid); min-height: 42px;
}
select.ok, input.ok { border-color: var(--good); background: var(--good-soft); }
select.bad, input.bad { border-color: var(--bad); background: var(--bad-soft); }
textarea { min-height: 96px; resize: vertical; }
.check-item { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 6px 2px; width: 100%; text-align: left; background: none; border: 0; }
.check-item svg { width: 20px; height: 20px; color: var(--faint); }
.check-item.on svg { color: var(--good); }
.sol-head { display: flex; align-items: center; gap: 7px; font: 650 1rem var(--display); }
.sol-head svg { width: 21px; height: 21px; }
.sol-head.ok { color: var(--good); } .sol-head.part { color: var(--warn); } .sol-head.bad { color: var(--bad); }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 5px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px; }
.steps li::before { content: counter(s) "."; color: var(--muted); font-size: .84rem; font-variant-numeric: tabular-nums; }
.ref { font-size: .8rem; color: var(--muted); }
.timer { font: 700 1.05rem var(--mono); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); }
.sticky-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--glass); }
.task-nav { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; }
.task-nav button { flex: none; min-width: 38px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--softer); font-weight: 700; font-size: .84rem; }
.task-nav button.on { background: var(--primary); color: var(--on-primary); border-color: transparent; }

/* Gewichtung der Klausur (Diagramm auf der Startseite) */
.wchart { display: flex; flex-direction: column; gap: 9px; }
.wrow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; padding: 5px 7px; margin: -5px -7px; border: 0; background: none; border-radius: 10px; width: calc(100% + 14px); text-align: left; position: relative; }
.wrow:hover { background: var(--soft); }
.wrow .lab { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; }
.wrow .val { color: var(--muted); font-size: .82rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.wtrack { height: 11px; display: block; }
.wtrack .w { display: block; height: 100%; border-radius: 4px; background: var(--primary-soft); overflow: hidden; }
.wtrack .m { display: block; height: 100%; background: var(--primary); border-radius: 0 4px 4px 0; transition: width .5s ease; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .78rem; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 96px; }
.days > div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%; font-size: .7rem; color: var(--muted); }
.days i { display: block; width: 100%; max-width: 30px; min-height: 3px; border-radius: 4px 4px 0 0; background: var(--primary); }

/* Laborelemente */
.lab-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tier { padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--softer); transition: background .3s ease, border-color .3s ease, transform .3s ease; }
.tier.hit { background: var(--warn-soft); border-color: var(--warn); transform: scale(1.012); }
.tier.safe { background: var(--good-soft); border-color: var(--good); }
.tier b { display: block; font-size: .9rem; }
.tier span { font-size: .8rem; color: var(--muted); }
.conn { text-align: center; font-size: .76rem; color: var(--muted); padding: 2px 0; }
.conn.on { color: var(--good); font-weight: 700; }
.fd-line { display: flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 10px; background: var(--soft); font: .88rem var(--mono); min-width: 0; flex-wrap: wrap; }
.fd-line.fire { background: var(--good-soft); }
.fd-line.test { background: var(--primary-soft); }
.fd-line.skip { opacity: .55; }
.fd-line.gone { text-decoration: line-through; opacity: .55; }
.fd-line .tag { margin-left: auto; font: 700 .72rem var(--sans); color: var(--muted); }
.attr { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 7px; border-radius: 8px; background: var(--soft); font: 700 .86rem var(--mono); }
.attr.in { background: var(--good-soft); color: var(--good); }
.attr.new { background: var(--good); color: #fff; animation: pop .35s ease; }
@keyframes pop { from { transform: scale(.5); } to { transform: none; } }
.attrs { display: flex; flex-wrap: wrap; gap: 5px; }
.tree-node { font-size: 12px; }
svg .node-box { fill: var(--solid); stroke: currentColor; stroke-width: 1.2; }
svg .node-hit { fill: var(--primary-soft); stroke: var(--primary); stroke-width: 2; }
svg .node-good { fill: var(--good-soft); stroke: var(--good); stroke-width: 2; }
svg .node-bad { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 2; }
svg .edge { stroke: currentColor; stroke-width: 1.3; opacity: .55; fill: none; }
svg .edge-hit { stroke: var(--primary); stroke-width: 2.4; opacity: 1; fill: none; }
svg .edge-gone { stroke: var(--bad); stroke-width: 1.6; stroke-dasharray: 5 4; opacity: .9; fill: none; }
svg .dot-a { fill: var(--primary); }
svg .dot-b { fill: var(--faint); }
svg .dot-c { fill: var(--good); }
svg .dot-q { fill: var(--warn); }
svg .fill-sel { fill: var(--primary); opacity: .32; }
svg .fill-off { fill: var(--soft); }
svg .stroke-fg { fill: none; stroke: currentColor; stroke-width: 1.4; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  #bg i { animation: none; }

    const T = S.attrs.every((a) => R.attrs.includes(a)) ? alignTo(S, R.attrs) : S;
    return RA.rel(R.attrs, R.rows.concat(T.rows));
  };
  RA.minus = function (R, S) {
    const T = S.attrs.every((a) => R.attrs.includes(a)) ? alignTo(S, R.attrs) : S;
    const keys = new Set(T.rows.map(rowKey));
    return RA.rel(R.attrs, R.rows.filter((r) => !keys.has(rowKey(r))));
  };
  RA.intersect = function (R, S) {
    const T = S.attrs.every((a) => R.attrs.includes(a)) ? alignTo(S, R.attrs) : S;
    const keys = new Set(T.rows.map(rowKey));
    return RA.rel(R.attrs, R.rows.filter((r) => keys.has(rowKey(r))));
  };
  RA.natural = function (R, S) {
    const common = R.attrs.filter((a) => S.attrs.includes(a));
    const restS = without(S.attrs, common);
    const attrs = R.attrs.concat(restS);
    const ci = common.map((a) => [RA.col(R, a), RA.col(S, a)]);
    const ri = restS.map((a) => RA.col(S, a));
    const rows = [];
    for (const a of R.rows) {
      for (const b of S.rows) {
        if (ci.every(([x, y]) => a[x] === b[y])) rows.push(a.concat(ri.map((i) => b[i])));
      }
    }
    return RA.rel(attrs, rows);
  };
  RA.theta = function (R, S, pred) {
    const attrs = R.attrs.concat(S.attrs);
    const rows = [];
    for (const a of R.rows) {
      for (const b of S.rows) {
        const env = {};
        R.attrs.forEach((n, i) => (env['l.' + n] = a[i]));
        S.attrs.forEach((n, i) => (env['r.' + n] = b[i]));
        if (pred(env)) rows.push(a.concat(b));

    return RA.rel(attrs, rows);

  // Outer Joins über die gleichnamigen Attribute (fehlende Partner werden NULL).
  RA.leftOuter = function (R, S) {
    const J = RA.natural(R, S);
    const matched = RA.project(J, R.attrs);
    const missing = RA.minus(R, matched);
    const restS = without(S.attrs, R.attrs);
    return RA.rel(J.attrs, J.rows.concat(missing.rows.map((r) => r.concat(restS.map(() => null)))));
  };
  RA.rightOuter = function (R, S) {
    const J = RA.natural(R, S);
    const matched = RA.project(J, S.attrs);
    const missing = RA.minus(S, matched);
    const rows = J.rows.slice();
    for (const m of missing.rows) {
      rows.push(J.attrs.map((a) => (S.attrs.includes(a) ? m[S.attrs.indexOf(a)] : null)));
    }
    return RA.rel(J.attrs, rows);
  };
  RA.fullOuter = (R, S) => {
    const L = RA.leftOuter(R, S);
    const Q = RA.rightOuter(R, S);

  // Division über die Formel aus dem Skript: π_A(R) − π_A((π_A(R) × S) − R).
  RA.divide = function (R, S) {
    const Z = without(R.attrs, S.attrs);
    const A = RA.project(R, Z);
    const product = RA.cross(A, S);
    const missing = RA.minus(product, R);
    const bad = RA.project(missing, Z);
    const result = RA.minus(A, bad);
    return { Z, A, product, missing, bad, result };
  };
  RA.equal = function (R, S) {
    if (!sameSet(R.attrs, S.attrs)) return false;
    const T = alignTo(S, R.attrs);
    const a = R.rows.map(rowKey).sort();
    const b = T.rows.map(rowKey).sort();
    return a.length === b.length && a.every((k, i) => k === b[i]);
  };
  RA.cell = (v) => (v === null || v === undefined ? 'NULL' : String(v));
  RA.table = (R, title) => ({ title: title || R.name || undefined, head: R.attrs.slice(), rows: R.rows.map((r) => r.map(RA.cell)) });

  // ---------------------------------------------------------------------------
  // ER-Modell in ein relationales Schema überführen (Regeln aus Kapitel 4)
  // ---------------------------------------------------------------------------
  const ERM = {};
  ERM.type = function (name) {
    if (/(ID|Nr|Nummer)$/.test(name) || /^(Menge|Anzahl|Etage|Kapazität|Baujahr|Jahr|Titelanzahl|Sitzplätze|Stockwerk|Plätze|Dauer|Länge)$/.test(name)) return 'integer';
    if (/(datum|Datum)$/.test(name) || name === 'Datum') return 'date';
    if (/(Preis|Note|Betrag|Größe|Gewicht)$/.test(name)) return 'decimal';
    if (/Uhrzeit$/.test(name)) return 'time';
    return 'string';
  };
  ERM.clean = (a) => a.replace(/^[*~/]/, '').replace(/^{|}$/g, '');
  ERM.raw = (a) => (typeof a === 'string' ? a : a.n);
  ERM.toSchema = function (er) {
    const tables = er.ents.map((e) => ({
      name: e.n,
      attrs: (e.attrs || []).map(ERM.raw).map((a) => ({ n: ERM.clean(a), ty: ERM.type(ERM.clean(a)), pk: a.startsWith('*') || a.startsWith('~') })),
      fks: [],
      uniq: []
    }));
    const find = (n) => tables.find((t) => t.name === n);
    const keyAttrs = (n) => find(n).attrs.filter((a) => a.pk);
    for (const r of er.rels || []) {
      const many = (c) => c !== '1';
      const relAttrs = (r.attrs || []).map((a) => ({ n: ERM.clean(a), ty: ERM.type(ERM.clean(a)) }));
      if (many(r.ca) && many(r.cb)) {
        const name = r.table || r.a + '_' + r.b;
        const t = { name, attrs: [], fks: [], uniq: [], link: true };
        for (const side of [r.a, r.b]) {
          for (const k of keyAttrs(side)) {
            t.attrs.push({ n: k.n, ty: k.ty, pk: true });
            t.fks.push(name + '.' + k.n + ' → ' + side + '.' + k.n);
          }
        }
        t.attrs = t.attrs.concat(relAttrs);
        tables.push(t);
      } else {
        // FK auf die viele-Seite, bei 1:1 auf die Seite b (mit UNIQUE).
        const host = many(r.ca) ? r.a : r.fkIn || r.b;
        const other = host === r.a ? r.b : r.a;
        const t = find(host);
        for (const k of keyAttrs(other)) {
          t.attrs.push({ n: k.n, ty: k.ty, fk: true });
          t.fks.push(host + '.' + k.n + ' → ' + other + '.' + k.n);
          if (!many(r.ca) && !many(r.cb)) t.uniq.push(k.n);
        }
        t.attrs = t.attrs.concat(relAttrs);
      }
    }
    return tables.map((t) => {
      const inner = t.attrs.map((a) => (a.pk ? '<u>' + a.n + ': ' + a.ty + '</u>' : a.n + ': ' + a.ty)).join(', ');
      const fk = t.fks.length ? ', FK: ' + t.fks.join(', ') : '';
      const uq = t.uniq.length ? ', UNIQUE(' + t.uniq.join(', ') + ')' : '';
      return { name: t.name, attrs: t.attrs, fks: t.fks, uniq: t.uniq, link: !!t.link, line: t.name + ' (' + inner + ')' + fk + uq };
    });
  };

  // ---------------------------------------------------------------------------
  // Aufgaben-Generatoren für den Trainer. make() liefert eine Frage im Format der module_*.json.
  // ---------------------------------------------------------------------------
  const Calc = {};
  let rng = Math.random;
  Calc.seed = function (s) {
    // Kleiner LCG, nur für reproduzierbare Tests.
    let x = s >>> 0;
    rng = function () {
      x = (Math.imul(x, 1664525) + 1013904223) >>> 0;
      return x / 4294967296;
    };

  const rnd = (n) => Math.floor(rng() * n);
  const pick = (a) => a[rnd(a.length)];
  const shuffle = (a) => {
    const b = a.slice();
    for (let i = b.length - 1; i > 0; i--) {
      const j = rnd(i + 1);
      [b[i], b[j]] = [b[j], b[i]];
    }
    return b;
  };
  const sample = (a, n) => shuffle(a).slice(0, n);
  const letters = (n) => 'ABCDEFGH'.slice(0, n).split('');
  const braces = (list) => '{ ' + list.join(', ') + ' }';

  // Die Originalklausur soll unverbraucht bleiben: diese FD-Menge wird nie erzeugt.
  const RESERVED_F = [['BD', 'E'], ['A', 'C'], ['C', 'D'], ['E', 'AB']];
  const signature = (F) => F.map((f) => f.l.slice().sort().join('') + '→' + f.r.slice().sort().join('')).sort().join(';');
  function permutations(a) {
    if (a.length < 2) return [a];
    return a.flatMap((x, i) => permutations(a.slice(0, i).concat(a.slice(i + 1))).map((p) => [x].concat(p)));
  }
  const RESERVED_SET = new Set(permutations('ABCDE'.split('')).map((perm) => {
    const map = (s) => s.split('').map((c) => perm['ABCDE'.indexOf(c)]);
    return signature(RESERVED_F.map(([l, r]) => ({ l: map(l), r: map(r) })));

  // Prüft F und die vereinigte Form: gleiche Struktur mit anderen Buchstaben zählt mit.
  FD.isReserved = (F) => RESERVED_SET.has(signature(F)) || RESERVED_SET.has(signature(FD.unify(F)));
  const RESERVED_FD = 'reserviert';
  const fdSignature = (F) => (FD.isReserved(F) || FD.isReserved(FD.canonical(F).Fc) ? RESERVED_FD : signature(F));

  function randomF(R, count, composite) {
    const F = [];
    for (let i = 0; i < count; i++) {
      const lsize = i === 0 && composite ? 2 : rng() < 0.3 ? 2 : 1;
      const l = FD.sortBy(sample(R, lsize), R);
      const r = FD.sortBy(sample(without(R, l), rng() < 0.3 ? 2 : 1), R);
      if (!F.some((f) => sameSet(f.l, l) && sameSet(f.r, r))) F.push(FD.make(l, r));
    }
    return F;
  }
  const figF = (R, F) => ({ t: 'f', x: 'R(' + R.join(', ') + ')\nF = ' + FD.setStr(F) });

  function hullSteps(X, F, R) {
    const h = FD.hull(X, F);
    const steps = ['Start: Erg = ' + braces(X)];
    for (const s of h.steps) {
      if (s.added.length) steps.push('**' + FD.str(s.fd) + '**: linke Seite in Erg, also dazu: ' + s.added.join(', ') + ' → Erg = ' + braces(FD.sortBy(s.erg, R)));
    }
    steps.push('Ein Durchlauf ohne Änderung, also fertig: **' + FD.hullName(X) + ' = ' + braces(FD.sortBy(h.result, R)) + '**');
    return steps;
  }

  const gens = [];
  const gen = (id, title, group, icon, formula, ref, lvl, pts, make) => gens.push({ id, title, group, icon, formula, ref, lvl, pts, make });
  const base = (id, k, q, extra) => {
    const g = gens.find((x) => x.id === id);
    return Object.assign({ id, k, lvl: g.lvl, pts: g.pts, q, ref: g.ref, src: 'trainer' }, extra);
  };

  gen('calc.closure', 'Attributhülle berechnen', 'Attributhülle & Schlüssel', 'plus.circle', 'Erg := α; Erg ∪= β, wenn α\' ⊆ Erg', 'T6 S.6', 2, 3, () => {

      const F = randomF(R, 4 + rnd(2));
      if (fdSignature(F) === RESERVED_FD) continue;
      const X = FD.sortBy(sample(R, 1 + rnd(2)), R);
      const h = FD.hull(X, F);
      if (h.result.length < X.length + 2) continue;
      return base('calc.closure', 'ms', 'Berechne die Attributhülle **' + FD.hullName(X) + '**. Wähle alle Attribute der Hülle.', {
        o: R,
        a: R.map((a, i) => (h.result.includes(a) ? i : -1)).filter((i) => i >= 0),
        steps: hullSteps(X, F, R),
        fig: figF(R, F),
        keep: true

  gen('calc.iskey', 'Ist X Kandidatenschlüssel?', 'Attributhülle & Schlüssel', 'key', 'X⁺ = R und X minimal', 'T6 S.14', 2, 3, () => {

      const name = FD.attrs(X);

      const superOk = FD.isSuper(X, R, F);
      if (!superOk) {
        steps.push('Es fehlen ' + without(R, FD.closure(X, F)).join(', ') + ', also ist ' + name + ' **kein Superschlüssel**.');

  gen('calc.keys', 'Alle Kandidatenschlüssel finden', 'Attributhülle & Schlüssel', 'key.horizontal', 'nur links: immer im Schlüssel', 'T6 S.14', 3, 4, () => {

  gen('calc.left', 'Linksreduktion', 'Kanonische Überdeckung', 'arrow.left.to.line', 'x überflüssig, wenn β ⊆ AH(F, α∖{x})', 'T7 S.23', 3, 4, () => {

  gen('calc.right', 'Rechtsreduktion', 'Kanonische Überdeckung', 'arrow.right.to.line', 'x überflüssig, wenn x ∈ AH(F′, α)', 'T7 S.23', 3, 4, () => {

  gen('calc.canon', 'Kanonische Überdeckung', 'Kanonische Überdeckung', 'checklist', 'links, rechts, leere weg, vereinigen', 'T7 S.23', 3, 5, () => {

  gen('calc.nf', 'Höchste Normalform bestimmen', 'Normalformen', 'stairs', '2NF: Teilschlüssel, 3NF: Nichtschlüssel, BCNF: Superschlüssel', 'T7 S.9', 3, 4, () => {

      timer = null;
      playBtn.replaceChildren(icon(on ? 'pause' : 'play'));
      playBtn.setAttribute('aria-label', on ? 'Pause' : 'Abspielen');
      if (on) {
        timer = setInterval(() => {
          if (!el.isConnected) return setPlaying(false);
          if (step < api.max) go(step + 1);
          else setPlaying(false);
        }, interval);
      }
    };
    const go = (s) => {
      step = Math.max(0, Math.min(api.max, s));
      back.disabled = step === 0;
      fwd.disabled = step >= api.max;
      count.textContent = step + '/' + api.max;
      onStep(step);
    };
    const resetBtn = h('button', { type: 'button', 'aria-label': 'Von vorn', onclick: () => { setPlaying(false); go(0); } }, icon('reset'));
    const back = h('button', { type: 'button', 'aria-label': 'Schritt zurück', onclick: () => { setPlaying(false); go(step - 1); } }, icon('prev'));
    const playBtn = h('button', { type: 'button', class: 'play', 'aria-label': 'Abspielen', onclick: () => { if (timer) setPlaying(false); else { if (step >= api.max) go(0); setPlaying(true); } } }, icon('play'));
    const fwd = h('button', { type: 'button', 'aria-label': 'Nächster Schritt', onclick: () => { setPlaying(false); go(step + 1); } }, icon('next'));
    const el = h('div', { class: 'stepper' }, resetBtn, back, playBtn, fwd, count);
    const api = { el, max: maxStep, go, get step() { return step; }, stop: () => setPlaying(false) };
    go(step);
    return api;
  };

  // Eine Relation als Tabelle. opts.rowClass(rowIndex) und opts.cellClass(rowIndex, colIndex) setzen Zustände.
  window.relTable = function (t, opts) {
    const o = opts || {};
    const headCells = t.head.map((c, i) => h('th', { class: o.headClass ? o.headClass(i) : undefined, html: md(c) }));
    const rows = t.rows.map((row, r) => {
      const cls = [o.rowClass ? o.rowClass(r) : null, (t.hl || []).includes(r) ? 'hl' : null, (t.ok || []).includes(r) ? 'ok' : null, (t.bad || []).includes(r) ? 'bad' : null, (t.dim || []).includes(r) ? 'dim' : null].filter(Boolean).join(' ');
      return h('tr', { class: cls || undefined, onclick: o.onRow ? () => o.onRow(r) : undefined },
        row.map((c, i) => {
          const isNull = c === 'NULL';
          const cc = [o.cellClass ? o.cellClass(r, i) : null, isNull ? 'null' : null].filter(Boolean).join(' ');
          return h('td', { class: cc || undefined, html: md(c) });
        }));
    });
    const table = h('table', { class: 'rel' + (o.data === false ? '' : ' data') },
      h('thead', null, h('tr', null, headCells)),
      h('tbody', null, rows));
    return h('div', { class: 'rel-box' },
      t.title ? h('div', { class: 'tb-title', html: md(t.title) }) : null,
      h('div', { class: 'tb-wrap' }, table));
  };
  window.relGroup = (tabs, opts) => h('div', { class: 'rels' }, tabs.map((t) => relTable(t, opts)));

  window.vizCard = (title, ...kids) => h('div', { class: 'viz' }, title ? h('div', { class: 'viz-title' }, icon('lab'), h('span', null, title)) : null, kids);
  window.caption = (text, kind) => h('div', { class: 'caption fade-in' + (kind ? ' ' + kind : ''), html: md(text) });
  window.segmented = function (items, active, onPick) {
    const el = h('div', { class: 'seg', role: 'tablist' });
    const draw = (cur) => {
      el.replaceChildren(...items.map((it) => h('button', { type: 'button', role: 'tab', class: it.id === cur ? 'on' : undefined, 'aria-selected': it.id === cur ? 'true' : 'false', onclick: () => { draw(it.id); onPick(it.id); } }, it.label)));
    };
    draw(active);
    return el;
  };
})();

// Chen-Diagramme aus Daten zeichnen: Entitäten, Beziehungen, Attribute, Kardinalitäten, is-a.
// Präfixe bei Attributen: *Schlüssel, ~partieller Schlüssel, {mehrwertig}, /abgeleitet.
(function () {
  'use strict';

  const CHAR = 6.9;
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

  function parseAttr(a) {
    const o = typeof a === 'string' ? { n: a } : Object.assign({}, a);
    if (o.n.startsWith('*')) { o.kind = 'key'; o.n = o.n.slice(1); }
    else if (o.n.startsWith('~')) { o.kind = 'partial'; o.n = o.n.slice(1); }
    else if (o.n.startsWith('{')) { o.kind = 'multi'; o.n = o.n.slice(1, -1); }
    else if (o.n.startsWith('/')) { o.kind = 'derived'; o.n = o.n.slice(1); }
    return o;
  }

  const attrWidth = (a) => Math.max(32, (a.n.length * CHAR) / 2 + 9);

  // Attribute fächern sich um ihren Besitzer auf. side: t, b, l, r. Der Abstand richtet sich nach der Textbreite.
  function fan(owner, attrs, side, h0) {
    const list = attrs.map(parseAttr);
    const horizontal = side !== 'l' && side !== 'r';
    const total = list.reduce((sum, a) => sum + attrWidth(a) * 2, 0) + (list.length - 1) * 6;
    let cursor = -total / 2;
    return list.map((a, i) => {
      const w = attrWidth(a);
      const center = cursor + w;
      cursor += w * 2 + 6;
      if (a.x !== undefined) return a;
      const off = i - (list.length - 1) / 2;
      const reach = h0 || 62;
      if (!horizontal) {
        const dir = side === 'l' ? -1 : 1;
        a.x = owner.x + dir * (Math.max(w + 58, 104) - Math.abs(off) * 10);
        a.y = owner.y + off * 36;
      } else {
        a.x = owner.x + center;
        a.y = owner.y + (side === 'b' ? 1 : -1) * (reach - Math.abs(off) * 8);
      }
      return a;
    });
  }

  function attrSvg(a, ox, oy, cls) {
    const rx = attrWidth(a);
    let s = '<line class="er-l ' + (cls || '') + '" x1="' + ox + '" y1="' + oy + '" x2="' + a.x + '" y2="' + a.y + '"/>';
    s += '<g class="er-a">';
    const dash = a.kind === 'derived' ? ' stroke-dasharray="4 3"' : '';
    s += '<ellipse cx="' + a.x + '" cy="' + a.y + '" rx="' + rx + '" ry="15"' + dash + '/>';
    if (a.kind === 'multi') s += '<ellipse cx="' + a.x + '" cy="' + a.y + '" rx="' + (rx - 3.5) + '" ry="11.5"/>';
    s += '<text x="' + a.x + '" y="' + (a.y + 4) + '" text-anchor="middle" font-size="12"' + (a.kind === 'key' ? ' text-decoration="underline" font-weight="700"' : '') + '>' + esc(a.n) + '</text>';
    for (const kid of a.kids || []) {
      const rk = Math.max(28, (kid.n.length * CHAR) / 2 + 8);
      s += '<line class="er-l" x1="' + a.x + '" y1="' + a.y + '" x2="' + kid.x + '" y2="' + kid.y + '"/><ellipse cx="' + kid.x + '" cy="' + kid.y + '" rx="' + rk + '" ry="14"/><text x="' + kid.x + '" y="' + (kid.y + 4) + '" text-anchor="middle" font-size="11.5">' + esc(kid.n) + '</text>';
    }
    if (a.kind === 'partial') {
      const w = (a.n.length * CHAR) / 2;
      s += '<line x1="' + (a.x - w) + '" y1="' + (a.y + 7) + '" x2="' + (a.x + w) + '" y2="' + (a.y + 7) + '" stroke="currentColor" stroke-width="1.1" stroke-dasharray="3 2"/>';
    }
    return s + '</g>';
  }

  function entityBox(e) {
    return { w: Math.max(84, e.n.length * CHAR + 26), h: 38 };
  }
  function relBox(r) {
    return { w: Math.max(96, r.n.length * CHAR + 44), h: 54 };
  }

  // Schnittpunkt der Linie vom Mittelpunkt (x,y) Richtung (tx,ty) mit dem Rechteck der Entität.
  function borderPoint(x, y, box, tx, ty, extra) {
    const dx = tx - x;
    const dy = ty - y;
    const len = Math.hypot(dx, dy) || 1;
    const sx = dx === 0 ? Infinity : box.w / 2 / Math.abs(dx);
    const sy = dy === 0 ? Infinity : box.h / 2 / Math.abs(dy);
    const t = Math.min(sx, sy);
    return { x: x + dx * t + (dx / len) * extra, y: y + dy * t + (dy / len) * extra, nx: -dy / len, ny: dx / len, ux: dx / len, uy: dy / len };
  }

  function linkSvg(a, b, total, cls) {
    const line = (x1, y1, x2, y2) => '<line class="er-l ' + (cls || '') + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>';
    if (!total) return line(a.x, a.y, b.x, b.y);
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = (-dy / len) * 2.2;
    const ny = (dx / len) * 2.2;
    return line(a.x + nx, a.y + ny, b.x + nx, b.y + ny) + line(a.x - nx, a.y - ny, b.x - nx, b.y - ny);
  }

  // Liefert fertiges SVG in Ebenen, damit die Animation sie nacheinander einblenden kann.
  function layers(d) {
    const ents = Object.fromEntries(d.ents.map((e) => [e.id || e.n, e]));
    const out = { ents: '', attrs: '', rels: '', cards: '', isa: '' };

    for (const e of d.ents) {
      for (const a of fan(e, e.attrs || [], e.side || 't', e.reach)) out.attrs += attrSvg(a, e.x, e.y);
    }
    for (const r of d.rels || []) {
      const ends = r.ends || [{ e: r.a, c: r.ca, total: r.ta }, { e: r.b, c: r.cb, total: r.tb }];
      const box = relBox(r);
      let drawn = '';
      if (r.self) {
        // Rekursive Beziehung: zwei Linien vom selben Entitätstyp, oben und unten zur Raute.
        const E = ents[ends[0].e];
        const bx = entityBox(E);
        const sx = E.x + bx.w / 2 - 14;
        const top = E.y - bx.h / 2;
        const bottom = E.y + bx.h / 2;
        const up = Math.min(top - 26, r.y - box.h / 2 - 12);
        const down = Math.max(bottom + 26, r.y + box.h / 2 + 12);
        drawn += '<path class="er-l" d="M ' + sx + ' ' + top + ' L ' + sx + ' ' + up + ' L ' + r.x + ' ' + up + ' L ' + r.x + ' ' + (r.y - box.h / 2) + '" fill="none"/>';
        drawn += '<path class="er-l" d="M ' + sx + ' ' + bottom + ' L ' + sx + ' ' + down + ' L ' + r.x + ' ' + down + ' L ' + r.x + ' ' + (r.y + box.h / 2) + '" fill="none"/>';
        out.cards += '<text class="er-c" x="' + (sx + 8) + '" y="' + (top - 8) + '" font-size="13">' + esc(ends[0].c) + '</text>';
        out.cards += '<text class="er-c" x="' + (sx + 8) + '" y="' + (bottom + 18) + '" font-size="13">' + esc(ends[1].c) + '</text>';
        if (ends[0].role) out.cards += '<text x="' + (sx + 26) + '" y="' + (top - 8) + '" font-size="11" opacity=".8">' + esc(ends[0].role) + '</text>';
        if (ends[1].role) out.cards += '<text x="' + (sx + 26) + '" y="' + (bottom + 18) + '" font-size="11" opacity=".8">' + esc(ends[1].role) + '</text>';
      } else {
        for (const end of ends) {
          const E = ents[end.e];
          drawn += linkSvg({ x: E.x, y: E.y }, { x: r.x, y: r.y }, end.total || (r.ident && end.e === r.weak));
          const extra = 11 + String(end.c || '').length * 3.4;
          const p = borderPoint(E.x, E.y, entityBox(E), r.x, r.y, extra);
          let nx = p.nx;
          let ny = p.ny;
          if (ny > 0.01 || (Math.abs(ny) <= 0.01 && nx < 0)) { nx = -nx; ny = -ny; }
          if (end.c) out.cards += '<text class="er-c" x="' + (p.x + nx * 9) + '" y="' + (p.y + ny * 9 + 4) + '" text-anchor="middle" font-size="13">' + esc(end.c) + '</text>';
          if (end.role) out.cards += '<text x="' + (p.x - nx * 10) + '" y="' + (p.y - ny * 10 + 4) + '" font-size="11" text-anchor="middle" opacity=".8">' + esc(end.role) + '</text>';
        }
      }
      out.rels += drawn;
      for (const a of fan(r, r.attrs || [], r.side || 't', 54)) out.rels += attrSvg(a, r.x, r.y);
      const hw = box.w / 2;
      const hh = box.h / 2;
      const pts = (k) => r.x + ',' + (r.y - hh + k) + ' ' + (r.x + hw - k * 1.6) + ',' + r.y + ' ' + r.x + ',' + (r.y + hh - k) + ' ' + (r.x - hw + k * 1.6) + ',' + r.y;
      out.rels += '<g class="er-r"><polygon points="' + pts(0) + '"/>' + (r.ident ? '<polygon points="' + pts(4.5) + '"/>' : '') + '<text x="' + r.x + '" y="' + (r.y + 4) + '" text-anchor="middle" font-size="12">' + esc(r.n) + '</text></g>';
    }
    for (const g of d.isa || []) {
      const sup = ents[g.sup];
      const label = g.n || 'is-a';
      const w = Math.max(50, label.length * CHAR + 18);
      out.isa += '<line class="er-l" x1="' + sup.x + '" y1="' + sup.y + '" x2="' + g.x + '" y2="' + g.y + '"/>';
      for (const s of g.subs) {
        const E = ents[s];
        out.isa += '<line class="er-l" x1="' + g.x + '" y1="' + g.y + '" x2="' + E.x + '" y2="' + E.y + '"/>';
      }
      out.isa += '<g class="er-r"><polygon points="' + g.x + ',' + (g.y - 16) + ' ' + (g.x + w / 2) + ',' + g.y + ' ' + g.x + ',' + (g.y + 16) + ' ' + (g.x - w / 2) + ',' + g.y + '"/><text x="' + g.x + '" y="' + (g.y + 4) + '" text-anchor="middle" font-size="11">' + esc(label) + '</text></g>';
      if (g.note) out.isa += '<text x="' + (g.x + w / 2 + 6) + '" y="' + (g.y + 4) + '" font-size="10.5" opacity=".75">' + esc(g.note) + '</text>';
    }
    for (const e of d.ents) {
      const b = entityBox(e);
      const label = e.n;
      let s = '<g class="er-e"><rect x="' + (e.x - b.w / 2) + '" y="' + (e.y - b.h / 2) + '" width="' + b.w + '" height="' + b.h + '" rx="3"/>';
      if (e.weak) s += '<rect x="' + (e.x - b.w / 2 + 3.5) + '" y="' + (e.y - b.h / 2 + 3.5) + '" width="' + (b.w - 7) + '" height="' + (b.h - 7) + '" rx="2"/>';
      s += '<text x="' + e.x + '" y="' + (e.y + 4.5) + '" text-anchor="middle" font-size="13.5" font-weight="650">' + esc(label) + '</text></g>';
      out.ents += s;
    }
    return out;
  }

  function svgMarkup(d, visible) {
    const v = visible || { attrs: true, rels: true, cards: true, isa: true };
    const l = layers(d);
    const g = (name, on) => '<g class="er-step' + (on ? '' : ' off') + '">' + l[name] + '</g>';
    return '<svg viewBox="0 0 ' + d.w + ' ' + d.h + '" role="img" aria-label="' + esc(d.title || 'ER-Diagramm') + '">' +
      g('rels', v.rels) + g('isa', v.isa) + g('attrs', v.attrs) + '<g>' + l.ents + '</g>' + g('cards', v.cards) + '</svg>';
  }

  const STAGES = [
    { label: 'Entitäten aus dem Text', v: { attrs: false, rels: false, cards: false, isa: false } },
    { label: 'Attribute und unterstrichener Schlüssel', v: { attrs: true, rels: false, cards: false, isa: false } },
    { label: 'Beziehungen als Rauten', v: { attrs: true, rels: true, cards: false, isa: true } },
    { label: 'Kardinalitäten: erst damit ist das Diagramm vollständig', v: { attrs: true, rels: true, cards: true, isa: true } }
  ];

  window.ER = {
    svg: svgMarkup,
    figure(d) {
      const big = d.w > 480;
      return h('div', { class: 'dia-scroll' + (big ? ' min' : ''), html: svgMarkup(d) });
    },
    // {t:"er", anim:true} baut das Diagramm in den vier Schritten des Skripts auf.
    block(b) {
      const d = b.er || b;
      if (!b.anim) {
        return h('figure', { class: 'dia' }, this.figure(d), b.title ? h('figcaption', { class: 'fig-cap', html: md(b.title) }) : null);
      }
      const holder = h('div', { class: 'dia-scroll' + (d.w > 480 ? ' min' : '') });
      const cap = h('div');
      const controls = stepControls(STAGES.length - 1, (i) => {
        holder.innerHTML = svgMarkup(d, STAGES[i].v);
        cap.replaceChildren(caption(STAGES[i].label));
      }, { start: STAGES.length - 1 });
      return vizCard(b.title || 'ER-Diagramm aufbauen', holder, cap, controls.el);
    }
  };
})();

// Darstellung der Inhaltsblöcke aus den module_*.json (entspricht Views/BlockViews.swift).
(function () {
  'use strict';

  const SCRIPT_NAMES = { 1: 'Einführung', 2: 'Architektur', 3: 'ERM', 4: 'Relationales Modell', 5: 'Relationale Algebra', 6: 'Normalformen 1', 7: 'Normalformen 2', 8: 'Übungsblatt 5', 9: 'Übungsblatt 6', 10: 'Notation Tabellenmodell', 11: 'Notation Relationenmodell' };
  window.scriptName = (part) => SCRIPT_NAMES[part] || 'Skript';
  window.refLabel = function (ref) {
    const m = /^T(\d+) S\.(.+)$/.exec(ref || '');
    return m ? 'Skript ' + scriptName(+m[1]) + ', S. ' + m[2] : ref;
  };

  // Dateiname einer Folie, derselbe Aufbau wie in tools/extract-slides.js und in der App.
  window.slideName = function (b) {
    const crop = b.crop ? '_' + b.crop.join('_') : '';
    return 's' + b.part + '_' + b.page + crop;
  };
  const slideSrc = (b) => {
    const name = slideName(b);
    return (window.DB_SLIDES && window.DB_SLIDES[name]) || 'slides/' + name + '.png';
  };

  window.openLightbox = function (src, title) {
    const old = document.getElementById('lightbox');
    if (old) old.remove();
    const close = () => { box.remove(); document.removeEventListener('keydown', esc); };
    const esc = (e) => { if (e.key === 'Escape') close(); };
    const zoomBtn = h('button', { type: 'button', class: 'btn s', onclick: () => { box.classList.toggle('zoom'); zoomBtn.textContent = box.classList.contains('zoom') ? 'Verkleinern' : 'Vergrößern'; } }, 'Vergrößern');
    const box = h('div', { id: 'lightbox', role: 'dialog', 'aria-modal': 'true', 'aria-label': title || 'Folie' },
      h('div', { class: 'bar-top' }, h('span', null, title || ''), h('span', { class: 'btns' }, zoomBtn, h('button', { type: 'button', class: 'btn s', onclick: close }, 'Schließen'))),
      h('img', { src, alt: title || 'Folie aus dem Skript' }));
    document.body.append(box);
    document.addEventListener('keydown', esc);
  };

  const R = {
    p: (b) => rich(b.x, 'prose'),
    h: (b) => h('h3', { class: 'sub', html: md(b.x) }),
    b: (b) => h('ul', { class: 'points' }, (b.i || []).map((x) => h('li', { html: md(x) }))),
    k: (b) => callout('k', 'bulb', 'Merke', b.x),
    w: (b) => callout('w', 'warn', 'Klausurfalle', b.x),
    ex: (b) => callout('ex', 'target', 'Klausurbezug', b.x),
    f: (b) => h('div', { class: 'formula' }, h('span', { html: md(b.x) }), b.title ? h('small', { html: md(b.title) }) : null),
    s: (b) => h('div', { class: 'schema', html: md(b.x) }),
    code: (b) => h('pre', { class: 'code' }, b.x),
    tb: (b) => relTable({ title: b.title, head: b.head || [], rows: b.rows || [] }, { data: false }),
    rels: (b) => relGroup(b.tabs || []),
    sl: (b) => {
      const src = slideSrc(b);
      const label = 'Skript ' + scriptName(b.part) + ', S. ' + b.page;
      return h('figure', { class: 'dia' },
        h('button', { type: 'button', class: 'slide', 'aria-label': 'Folie groß anzeigen: ' + (b.x || label), onclick: () => openLightbox(src, (b.x ? b.x + ' · ' : '') + label) },
          h('img', { src, alt: b.x || label, loading: 'lazy' })),
        h('figcaption', { class: 'fig-cap' }, (b.x ? b.x + ' · ' : '') + label));
    },
    st: (b) => stepBlock(b),
    er: (b) => ER.block(b),
    net: (b) => netBlock(b),
    bars: (b) => barsBlock(b),
    x: (b) => labBlock(b)
  };

  function callout(cls, ic, tag, text) {
    return h('div', { class: 'call ' + cls }, icon(ic), h('div', { class: 'prose' }, h('span', { class: 'tag' }, tag), h('span', { html: md(text) })));
  }

  window.renderBlock = function (b) {
    const fn = R[b.t];
    if (!fn) return h('div', { class: 'caption bad' }, 'Unbekannter Blocktyp: ' + b.t);
    return fn(b);
  };
  window.renderBlocks = (list) => h('div', { class: 'blocks' }, (list || []).map(renderBlock));

  // Schrittfolge mit Text, Formel und Tabellen, z. B. die Division.
  function stepBlock(b) {
    const stage = h('div', { class: 'stack' });
    const dots = b.steps.length - 1;
    const controls = stepControls(dots, (i) => {
      const s = b.steps[i];
      stage.replaceChildren(
        ...[
          s.f ? h('div', { class: 'formula fade-in', html: md(s.f) }) : null,
          s.tabs ? relGroup(s.tabs) : null,
          s.x ? caption(s.x) : null
        ].filter(Boolean)
      );
    });
    return vizCard(b.title || 'Schritt für Schritt', stage, controls.el);
  }

  // Knoten-Kanten-Diagramm mit Schritten (gleiches Format wie NetDiagramView in Swift).
  function netBlock(b) {
    const W = 620;
    const H = b.height || 260;
    const px = (n) => [34 + n.x * (W - 68), 26 + n.y * (H - 52)];
    const nodeById = Object.fromEntries(b.nodes.map((n) => [n.id, n]));
    const svgFor = (step) => {
      const hn = (step && step.hn) || [];
      const he = (step && step.he) || [];
      const dn = (step && step.dn) || [];
      const de = (step && step.de) || [];
      const pair = (list, e) => list.some((x) => (x[0] === e.a && x[1] === e.b) || (x[0] === e.b && x[1] === e.a));
      let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + (b.title || 'Diagramm').replace(/"/g, '') + '">';
      for (const e of b.edges || []) {
        const [x1, y1] = px(nodeById[e.a]);
        const [x2, y2] = px(nodeById[e.b]);
        const cls = pair(he, e) ? 'edge-hit' : pair(de, e) ? 'edge-gone' : 'edge';
        s += '<line class="' + cls + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>';
        if (e.l) s += '<text x="' + (x1 + x2) / 2 + '" y="' + ((y1 + y2) / 2 - 5) + '" text-anchor="middle" font-size="11" opacity=".75">' + e.l + '</text>';
      }
      for (const n of b.nodes) {
        const [x, y] = px(n);
        const w = Math.max(44, n.l.length * 7.2 + 16);
        const cls = hn.includes(n.id) ? 'node-hit' : dn.includes(n.id) ? 'node-bad' : 'node-box';
        s += '<rect class="node-box" x="' + (x - w / 2) + '" y="' + (y - 15) + '" width="' + w + '" height="30" rx="8"/>';
        if (cls !== 'node-box') s += '<rect class="' + cls + '" x="' + (x - w / 2) + '" y="' + (y - 15) + '" width="' + w + '" height="30" rx="8"/>';
        s += '<text x="' + x + '" y="' + (y + 4.5) + '" text-anchor="middle" font-size="12.5">' + n.l + '</text>';
      }
      return s + '</svg>';
    };
    const fig = h('div', { class: 'dia-scroll' });
    const cap = h('div');
    const steps = b.steps || [];
    const draw = (i) => {
      const step = steps[i];
      fig.innerHTML = svgFor(step);
      cap.replaceChildren(...(step ? [caption(step.x)] : []));
    };
    if (!steps.length) {
      draw(0);
      return vizCard(b.title, fig);
    }
    const controls = stepControls(steps.length - 1, draw);
    return vizCard(b.title, fig, cap, controls.el);
  }

  function barsBlock(b) {
    const top = Math.max(...b.bars.map((x) => x.v));

  }

  function labBlock(b) {

  window.DBLabs = window.DBLabs || {};

    host.append(vizCard('Labor: Attributhülle Schritt für Schritt', input.el, h('div', null, h('div', { class: 'tb-title' }, 'Startattribute α'), pickRow), out));

  Labs.keys = function (host, params) {

      const rows = [

        const sup = R.every((a) => hull.includes(a));
        const isK = keys.some((k) => k.length === X.length && k.every((a) => X.includes(a)));

  Labs.canon = function (host, params, api) {

    const buildTimeline = () => {
      const can = FD.canonical(F0);
      const items = [];
      let cur = FD.clone(F0);
      for (const e of can.left.log) {
        const hullText = FD.hullName(e.rest) + ' = ' + set(e.hull, R);
        items.push({ phase: '1. Linksreduktion', F: FD.clone(cur), mark: { index: e.index }, q: 'Ist **' + e.x + '** in **' + FD.str(e.fd) + '** überflüssig?', removed: e.removed, why: hullText + (e.removed ? ' enthält ' + FD.attrs(e.fd.r) + ', also ist ' + e.x + ' überflüssig.' : ' enthält ' + FD.attrs(e.fd.r) + ' nicht, also bleibt ' + e.x + '.'), apply: (G) => { if (e.removed) G[e.index].l = e.rest; } });
        if (e.removed) cur[e.index].l = e.rest;

      for (const e of can.right.log) {

        if (e.removed) cur[e.index].r = cur[e.index].r.filter((a) => a !== e.x);
      }
      const dropped = cur.filter((f) => !f.r.length);
      items.push({ phase: '3. Leere rechte Seiten streichen', F: FD.clone(cur), info: dropped.length ? 'Gestrichen: ' + dropped.map((f) => FD.attrs(f.l) + ' → ∅').join(', ') : 'Keine FD hat eine leere rechte Seite.' });
      items.push({ phase: '4. Gleiche linke Seiten vereinigen', F: can.Fc, info: 'Ergebnis: **F_{c} = ' + FD.setStr(can.Fc) + '**', final: true });

  const NF_CASES = {

  Labs.nf = function (host, params, api) {

      ];
      const decomposition = () => {
        const d = FD.bcnfDecompose(R, F);

          return;

      };
      ask();
      area.replaceChildren(
        h('div', { class: 'stack-s' }, h('div', { class: 'schema' }, 'R(' + R.join(', ') + ')'), F.map((f) => h('div', { class: 'fd-line' }, FD.str(f)))),

        total++;
        if (s.key === 'product' || s.key === 'A') {

          const input = h('input', { type: 'text', inputmode: 'numeric', id: 'div-n-' + Math.random().toString(36).slice(2, 7), 'aria-label': 'Anzahl der Tupel', placeholder: 'Anzahl der Tupel' });

            input,
            h('button', { type: 'button', class: 'btn pri full', onclick: (e) => {

            } }, 'Prüfen'),
            fb);
          return;
        }
        const cand = candidates[s.key];

        const solution = new Set(s.res.rows.map((r) => JSON.stringify(r)));

        const tableHost = h('div');
        const fb = h('div');
        const drawTable = () => {
          tableHost.replaceChildren(relTable({ title: 'Tippe alle Tupel an, die zum Ergebnis gehören', head: cand.attrs, rows: cand.rows.map((r) => r.map(RA.cell)) }, {
            rowClass: (i) => {
              const k = JSON.stringify(cand.rows[i]);
              const on = picked.includes(k);
              if (checked) return solution.has(k) ? 'ok' : on ? 'bad' : 'dim';
              return 'pick' + (on ? ' on' : '');
            },
            onRow: (i) => {
              if (checked) return;
              const k = JSON.stringify(cand.rows[i]);
              picked = picked.includes(k) ? picked.filter((x) => x !== k) : picked.concat(k);
              drawTable();
            }
          }));
        };
        drawTable();
        const context = s.key === 'A' ? [RA.table(R, 'R'), RA.table(S, 'S')] : s.key === 'missing' ? [RA.table(R, 'R')] : s.key === 'bad' ? [RA.table(list[2].res, '(A × S) − R')] : [RA.table(d.A, 'A'), RA.table(d.bad, 'Kandidaten mit Lücke')];
        const checkBtn = h('button', { type: 'button', class: 'btn pri full', onclick: () => {
          checked = true;

          fb.replaceChildren(caption((right ? '**Richtig.** ' : '**Noch nicht.** Grün sind die richtigen Tupel. ') + s.x, right ? 'ok' : 'bad'), h('button', { type: 'button', class: 'btn pri full', onclick: () => { idx++; drawStep(); } }, idx + 1 < list.length ? 'Nächster Schritt' : 'Ergebnis ansehen'));
        } }, 'Prüfen');
        stage.replaceChildren(

          relGroup(context),
          h('div', { class: 'formula', html: md(s.f) }),
          tableHost, checkBtn, fb);
      };
      drawStep();
      area.replaceChildren(stage);
    };
    const makeTask = () => {
      const t = Calc.divisionTask();
      return { R: t.R, S: t.S, fresh: true, q: t.theme.a + ' wie ' + t.target };
    };

    if (params.mode === 'practice') {
      host.append(vizCard('Division selbst durchführen', area));
      practice(params.data ? { R: DIV_DATA[params.data].R, S: DIV_DATA[params.data].S, q: DIV_DATA[params.data].q } : makeTask());

    const select = h('select', { 'aria-label': 'Beispiel wählen', id: 'div-' + Math.random().toString(36).slice(2, 7), onchange: (e) => { data = DIV_DATA[e.target.value]; explain(); } }, Object.entries(DIV_DATA).map(([id, x]) => h('option', { value: id }, x.label)));
    host.append(vizCard('Labor: Die Division in fünf Schritten', h('div', null, h('div', { class: 'tb-title' }, 'Beispiel'), select), area));
    explain();
    if (params.data) select.value = params.data;
  };

  // ---------------------------------------------------------------------------
  // Spielwiese auf der Vorlesungs-Datenbank aus VorlesungenDump.sql.
  Labs.raplay = function (host) {
    const T = window.VORLESUNGEN;
    const tables = Object.keys(T);
    const rel = (n) => RA.rel(T[n].attrs, T[n].rows, n);
    const presets = [
      { label: 'Selektion: Kurse in Raum 1010.4.08', ops: [{ o: 'from', t: 'KURS' }, { o: 'sel', a: 'KURSORT', v: '1010.4.08' }] },
      { label: 'Projektion: Vor- und Nachnamen', ops: [{ o: 'from', t: 'PERSON' }, { o: 'pro', a: ['VORNAME', 'NAME'] }] },
      { label: 'Join: Analysis-Kurse über THEMA', ops: [{ o: 'from', t: 'KURS' }, { o: 'join', t: 'THEMA' }, { o: 'sel', a: 'THEMENGEBIET', v: 'Analysis' }, { o: 'pro', a: ['KURSBEZEICHNUNG', 'KURSORT'] }] },
      { label: 'Join: Wer belegt was?', ops: [{ o: 'from', t: 'BELEGUNG' }, { o: 'join', t: 'PERSON' }, { o: 'join', t: 'KURS' }, { o: 'pro', a: ['NAME', 'KURSBEZEICHNUNG'] }] },
      { label: 'Division: Kurse mit allen Rollen von Kurs 454', ops: [{ o: 'from', t: 'KONTROLLE' }, { o: 'pro', a: ['KNR', 'RNR'] }, { o: 'div454' }] }
    ];
    let ops = [];
    const stage = h('div', { class: 'stack' });
    const evaluate = () => {
      let cur = null;
      let ra = '';
      let sqlFrom = '';
      const where = [];
      let cols = '*';
      for (const op of ops) {
        if (op.o === 'from') { cur = rel(op.t); ra = op.t; sqlFrom = op.t; }
        else if (op.o === 'sel') {
          cur = RA.select(cur, (r) => String(r[op.a]) === String(op.v));
          ra = 'σ_{' + op.a + "='" + op.v + "'}(" + ra + ')';
          where.push(op.a + " = '" + op.v + "'");
        } else if (op.o === 'pro') {
          cur = RA.project(cur, op.a);
          ra = 'π_{' + op.a.join(', ') + '}(' + ra + ')';
          cols = op.a.join(', ');
        } else if (op.o === 'join') {
          const common = cur.attrs.filter((a) => T[op.t].attrs.includes(a));
          cur = RA.natural(cur, rel(op.t));
          ra = '(' + ra + ' ⋈ ' + op.t + ')';
          sqlFrom += ' NATURAL JOIN ' + op.t + ' /* ' + common.join(', ') + ' */';
        } else if (op.o === 'div454') {
          const S = RA.project(RA.select(rel('KONTROLLE'), (r) => r.KNR === '454'), ['RNR']);
          const K = RA.project(rel('KONTROLLE'), ['KNR', 'RNR']);
          cur = RA.divide(K, S).result;
          ra = 'KONTROLLE ÷ π_{RNR}(σ_{KNR=454}(KONTROLLE))';
          sqlFrom = null;
        }
      }
      return { cur, ra, sql: sqlFrom ? 'SELECT ' + cols + ' FROM ' + sqlFrom + (where.length ? ' WHERE ' + where.join(' AND ') : '') : 'In SQL formuliert man Division meist mit doppeltem NOT EXISTS.' };
    };
    const draw = () => {
      const { cur, ra, sql } = evaluate();
      const attrs = cur.attrs;
      const selAttr = h('select', { 'aria-label': 'Attribut', id: 'pl-a-' + stageId }, attrs.map((a) => h('option', { value: a }, a)));
      const selVal = h('select', { 'aria-label': 'Wert', id: 'pl-v-' + stageId });
      const fillVals = () => {
        const i = attrs.indexOf(selAttr.value);
        const vals = Array.from(new Set(cur.rows.map((r) => String(r[i])))).slice(0, 40);
        selVal.replaceChildren(...vals.map((v) => h('option', { value: v }, v)));
      };
      selAttr.addEventListener('change', fillVals);
      fillVals();
      const joinable = tables.filter((t) => T[t].attrs.some((a) => attrs.includes(a)));
      const selJoin = h('select', { 'aria-label': 'Tabelle für den Join', id: 'pl-j-' + stageId }, joinable.map((t) => h('option', { value: t }, t + ' (über ' + T[t].attrs.filter((a) => attrs.includes(a)).join(', ') + ')')));
      const proj = attrs.map((a) => ({ a, on: true }));
      const chips = h('div', { class: 'chips' }, proj.map((p) => {
        const b = h('button', { type: 'button', class: 'chip on', onclick: () => { p.on = !p.on; b.className = 'chip' + (p.on ? ' on' : ''); } }, p.a);
        return b;
      }));
      stage.replaceChildren(
        h('div', { class: 'formula', html: md(ra) }),
        h('div', { class: 'schema' }, sql),
        relTable({ title: cur.rows.length + ' Zeilen', head: attrs, rows: cur.rows.slice(0, 30).map((r) => r.map(RA.cell)) }),
        cur.rows.length > 30 ? h('div', { class: 'small muted' }, 'Es werden die ersten 30 Zeilen gezeigt.') : null,
        h('div', { class: 'stack-s' },
          h('h3', null, 'Nächsten Operator anwenden'),
          h('div', { class: 'lab-grid' },
            h('div', { class: 'stack-s' }, h('b', { class: 'small' }, 'σ Selektion'), selAttr, selVal, h('button', { type: 'button', class: 'btn s', onclick: () => { ops.push({ o: 'sel', a: selAttr.value, v: selVal.value }); draw(); } }, 'Zeilen filtern')),
            h('div', { class: 'stack-s' }, h('b', { class: 'small' }, 'π Projektion'), chips, h('button', { type: 'button', class: 'btn s', onclick: () => { const on = proj.filter((p) => p.on).map((p) => p.a); if (on.length) { ops.push({ o: 'pro', a: on }); draw(); } } }, 'Spalten behalten')),
            joinable.length ? h('div', { class: 'stack-s' }, h('b', { class: 'small' }, '⋈ Natural Join'), selJoin, h('button', { type: 'button', class: 'btn s', onclick: () => { ops.push({ o: 'join', t: selJoin.value }); draw(); } }, 'Tabelle verknüpfen')) : null)));
    };
    const stageId = Math.random().toString(36).slice(2, 7);
    const start = h('select', { 'aria-label': 'Starttabelle', id: 'pl-s-' + stageId, onchange: (e) => { ops = [{ o: 'from', t: e.target.value }]; draw(); } }, tables.map((t) => h('option', { value: t }, t)));
    const preset = h('select', { 'aria-label': 'Beispielanfrage', id: 'pl-p-' + stageId, onchange: (e) => { if (e.target.value !== '') { ops = presets[+e.target.value].ops.map((o) => Object.assign({}, o)); draw(); } } }, h('option', { value: '' }, 'Beispielanfrage wählen …'), presets.map((p, i) => h('option', { value: i }, p.label)));
    ops = presets[2].ops.map((o) => Object.assign({}, o));
    host.append(vizCard('Labor: Algebra auf der Vorlesungs-Datenbank',
      h('div', { class: 'lab-grid' }, h('div', null, h('div', { class: 'tb-title' }, 'Beispiel'), preset), h('div', null, h('div', { class: 'tb-title' }, 'Oder neu starten mit Tabelle'), start)),
      stage));
    draw();
  };
})();

  // Ähnlichkeitssuche im Embedding-Raum, stark vereinfacht auf zwei Dimensionen.
  Labs.vector = function (host) {
    const P = [['Tagesrucksack', 0.62, 0.84], ['Wanderrucksack', 0.72, 0.8], ['Trekkingrucksack', 0.8, 0.86], ['Schlafsack', 0.86, 0.66], ['Zelt', 0.93, 0.56], ['Wanderschuh', 0.58, 0.62], ['Laufschuh', 0.42, 0.68], ['Sandale', 0.3, 0.74], ['Wälzlager', 0.86, 0.12], ['Rollenlager', 0.75, 0.2], ['Kugellager', 0.93, 0.24], ['Hammer', 0.48, 0.2], ['Akkuschrauber', 0.36, 0.3], ['Bohrer', 0.27, 0.2], ['Espresso', 0.14, 0.56], ['Filterkaffee', 0.08, 0.46], ['Tee', 0.16, 0.38]];
    let q = { x: 0.66, y: 0.74 };
    let k = 3;
    let metric = 'euclid';
    const W = 340;
    const H = 260;
    const fig = h('div', { class: 'dia-scroll', style: 'touch-action:none' });
    const cap = h('div');
    const near = () => P.map((p) => {
      const dx = p[1] - q.x;
      const dy = p[2] - q.y;
      const dist = metric === 'euclid' ? Math.hypot(dx, dy) : 1 - (p[1] * q.x + p[2] * q.y) / (Math.hypot(p[1], p[2]) * Math.hypot(q.x, q.y) || 1);
      return { p, dist };
    }).sort((a, b) => a.dist - b.dist);
    const X = (v) => 12 + v * (W - 24);
    const Y = (v) => H - 12 - v * (H - 24);
    const draw = () => {
      const res = near();
      const top = res.slice(0, k);
      let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Punkte im Vektorraum und die nächsten Nachbarn der Anfrage" style="cursor:crosshair">';
      s += '<rect x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '" rx="10" fill="none" stroke="currentColor" opacity=".2"/>';
      top.forEach((t) => { s += '<line class="edge-hit" x1="' + X(q.x) + '" y1="' + Y(q.y) + '" x2="' + X(t.p[1]) + '" y2="' + Y(t.p[2]) + '"/>'; });
      P.forEach((p) => {
        const on = top.some((t) => t.p === p);
        s += '<circle class="' + (on ? 'dot-c' : 'dot-b') + '" cx="' + X(p[1]) + '" cy="' + Y(p[2]) + '" r="' + (on ? 6 : 4.5) + '"/>';
        s += '<text x="' + X(p[1]) + '" y="' + (Y(p[2]) - 8) + '" font-size="9.5" text-anchor="middle"' + (on ? ' font-weight="700"' : ' opacity=".7"') + '>' + p[0] + '</text>';
      });
      s += '<circle class="dot-q" cx="' + X(q.x) + '" cy="' + Y(q.y) + '" r="8"/></svg>';
      fig.innerHTML = s;
      cap.replaceChildren(caption('**Treffer:** ' + top.map((t) => t.p[0] + ' (' + t.dist.toFixed(3).replace('.', ',') + ')').join(', ') + '\nDie Linien sind das Ergebnis der kNN-Suche zur Laufzeit. Anders als im Graphmodell sind sie **nicht gespeichert**.'));
    };
    const move = (e) => {
      const svg = fig.querySelector('svg');
      if (!svg) return;
      const r = svg.getBoundingClientRect();
      const px = ((e.clientX - r.left) / r.width) * W;
      const py = ((e.clientY - r.top) / r.height) * H;
      q = { x: Math.max(0.01, Math.min(0.99, (px - 12) / (W - 24))), y: Math.max(0.01, Math.min(0.99, (H - 12 - py) / (H - 24))) };
      draw();
    };
    let dragging = false;
    fig.addEventListener('pointerdown', (e) => { dragging = true; move(e); });
    fig.addEventListener('pointermove', (e) => { if (dragging) move(e); });
    window.addEventListener('pointerup', () => { dragging = false; });
    const kLabel = h('b', { class: 'num' }, String(k));
    const slider = h('input', { type: 'range', min: 1, max: 6, value: k, id: 'vec-k-' + Math.random().toString(36).slice(2, 7), 'aria-label': 'Anzahl k der nächsten Nachbarn', style: 'flex:1;min-height:0;padding:0', oninput: (e) => { k = +e.target.value; kLabel.textContent = String(k); draw(); } });
    host.append(vizCard('Labor: Anfrage ziehen, nächste Nachbarn finden',
      segmented([{ id: 'euclid', label: 'Euklidisch' }, { id: 'cos', label: 'Kosinus' }], 'euclid', (id) => { metric = id; draw(); }),
      fig,
      h('div', { class: 'row small' }, h('span', null, 'k ='), kLabel, slider),
      cap));
    draw();
  };

  Labs.cardinality = function (host) {
    const TYPES = {
      '11': { label: '1:1', a: 'Fahrer', b: 'Führerschein', rel: 'besitzt', la: ['Ali', 'Bea', 'Cem'], lb: ['F-1', 'F-2'], links: [[0, 0], [1, 1]], maxA: 1, maxB: 1, mm: 'Fahrer (0,1) · Führerschein (1,1)', text: 'Jeder Fahrer hat höchstens einen Führerschein, jeder Führerschein gehört genau einem Fahrer. Cem hat keinen, das ist erlaubt (min 0).' },

      nm: { label: 'N:M', a: 'Fahrer', b: 'Fahrweg', rel: 'nutzt', la: ['Ali', 'Bea', 'Cem'], lb: ['A8', 'B10', 'B27'], links: [[0, 0], [0, 1], [1, 0], [2, 2]], maxA: Infinity, maxB: Infinity, mm: 'Fahrer (1,∗) · Fahrweg (0,∗)', text: 'Auf beiden Seiten sind mehrere Partner erlaubt. Diese Beziehung braucht später eine eigene Verknüpfungstabelle.' }
    };
    let t = TYPES['11'];
    let links = t.links.slice();
