    const fig = h('div', { class: 'dia-scroll' });
    const cap = h('div');
    const W = 320;
    const rowY = (i) => 30 + i * 46;
    const draw = (msg, kind) => {
      let s = '<svg viewBox="0 0 ' + W + ' 170" style="max-width:420px;margin:auto" role="img" aria-label="Verbindungen zwischen ' + t.a + ' und ' + t.b + '">';
      s += '<text x="48" y="14" text-anchor="middle" font-size="12" font-weight="700">' + t.a + '</text><text x="272" y="14" text-anchor="middle" font-size="12" font-weight="700">' + t.b + '</text><text x="160" y="14" text-anchor="middle" font-size="11" opacity=".7">' + t.rel + '</text>';
      links.forEach(([a, b]) => { s += '<line class="edge-hit" x1="86" y1="' + rowY(a) + '" x2="234" y2="' + rowY(b) + '"/>'; });
      t.la.forEach((n, i) => { s += '<g data-a="' + i + '" style="cursor:pointer"><rect class="' + (selected === i ? 'node-hit' : 'node-box') + '" x="10" y="' + (rowY(i) - 15) + '" width="76" height="30" rx="8"/><text x="48" y="' + (rowY(i) + 4) + '" text-anchor="middle" font-size="12">' + n + '</text></g>'; });
      t.lb.forEach((n, i) => { s += '<g data-b="' + i + '" style="cursor:pointer"><rect class="node-box" x="234" y="' + (rowY(i) - 15) + '" width="76" height="30" rx="8"/><text x="272" y="' + (rowY(i) + 4) + '" text-anchor="middle" font-size="12">' + n + '</text></g>'; });
      fig.innerHTML = s + '</svg>';
      fig.querySelectorAll('[data-a]').forEach((g) => g.addEventListener('click', () => { selected = +g.dataset.a; draw(); }));
      fig.querySelectorAll('[data-b]').forEach((g) => g.addEventListener('click', () => {
        if (selected === null) return draw('Tippe zuerst links auf einen ' + t.a + '.', 'warn');
        const b = +g.dataset.b;
        const has = links.some((l) => l[0] === selected && l[1] === b);
        if (has) {
          links = links.filter((l) => !(l[0] === selected && l[1] === b));
          selected = null;
          return draw('Verbindung entfernt.');
        }
        const countB = links.filter((l) => l[1] === b).length;
        const countA = links.filter((l) => l[0] === selected).length;
        if (countB >= t.maxB) return draw('**Verboten:** ' + t.lb[b] + ' hat schon einen ' + t.a + '. Bei ' + t.label + ' ist auf dieser Seite nur ein Partner erlaubt.', 'bad');
        if (countA >= t.maxA) return draw('**Verboten:** ' + t.la[selected] + ' hat schon einen Partner. Bei ' + t.label + ' ist auch auf dieser Seite nur einer erlaubt.', 'bad');
        links = links.concat([[selected, b]]);
        selected = null;
        draw('Verbindung erlaubt.', 'ok');
      }));
      cap.replaceChildren(caption((msg ? msg + '\n' : '') + t.text + '\n(min, max): ' + t.mm, kind));
    };
    host.append(vizCard('Labor: Kardinalität ausprobieren',
      segmented(Object.entries(TYPES).map(([id, x]) => ({ id, label: x.label })), '11', (id) => { t = TYPES[id]; links = t.links.slice(); selected = null; draw(); }),
      h('div', { class: 'small muted' }, 'Tippe links auf einen Eintrag und dann rechts auf einen Partner.'),
      fig, cap));
    draw();
  };

  // ---------------------------------------------------------------------------
  // Geführte Modellierung in den drei Schritten des Skripts, am Ende das fertige Chen-Diagramm.
  Labs.erbuilder = function (host, params, api) {
    const sc = params;
    const er = sc.er;
    const entities = er.ents.map((e) => e.n);
    const area = h('div', { class: 'stack' });
    const scores = [];
    const textBox = () => h('div', { class: 'caption' }, h('div', { html: md(sc.text) }));

    const stepEntities = () => {
      const all = Calc.shuffle(entities.concat(sc.distract || []));
      let picked = [];
      const chips = h('div', { class: 'chips' });
      const fb = h('div');
      const drawChips = (checked) => chips.replaceChildren(...all.map((n) => {
        const on = picked.includes(n);
        const isEnt = entities.includes(n);
        const cls = checked ? (isEnt ? ' ok' : on ? ' bad' : '') : on ? ' on' : '';
        return h('button', { type: 'button', class: 'chip' + cls, disabled: checked, 'aria-pressed': on ? 'true' : 'false', onclick: () => { picked = on ? picked.filter((x) => x !== n) : picked.concat(n); drawChips(false); } }, n);
      }));
      drawChips(false);
      const btn = h('button', { type: 'button', class: 'btn pri full', onclick: () => {
        const hits = picked.filter((n) => entities.includes(n)).length;
        const wrong = picked.length - hits;
        scores.push(Math.max(0, (hits - wrong) / entities.length));
        drawChips(true);
        btn.remove();
        fb.replaceChildren(caption(wrong || hits < entities.length ? 'Grün sind die Entitätstypen. ' + (sc.distractWhy || 'Die anderen Begriffe sind Attribute oder gehören nicht zum Modell.') : '**Alle Entitätstypen richtig.**', wrong || hits < entities.length ? 'warn' : 'ok'), h('button', { type: 'button', class: 'btn pri full', onclick: stepKeys }, 'Weiter: Schlüssel festlegen'));
      } }, 'Prüfen');
      area.replaceChildren(h('span', { class: 'pill exam' }, 'Schritt 1 von 3: Entitätstypen'), textBox(), h('p', null, 'Welche Begriffe sind Entitätstypen, also eigenständige Objekte mit eigenen Eigenschaften?'), chips, btn, fb);
    };

    const stepKeys = () => {
      const picks = {};
      const list = h('div', { class: 'stack-s' });
      const fb = h('div');
      const attrName = (a) => ERM.clean(ERM.raw(a));
      const keyOf = (e) => attrName(e.attrs.find((a) => /^[*~]/.test(ERM.raw(a))));
      const draw = (checked) => list.replaceChildren(...er.ents.map((e) => h('div', { class: 'stack-s', style: 'padding:8px 0;border-top:1px solid var(--line)' },
        h('b', { class: 'small' }, e.n),
        h('div', { class: 'chips' }, e.attrs.map(attrName).map((n) => {
          const on = picks[e.n] === n;
          const isKey = keyOf(e) === n;
          const cls = checked ? (isKey ? ' ok' : on ? ' bad' : '') : on ? ' on' : '';
          return h('button', { type: 'button', class: 'chip' + cls, disabled: checked, 'aria-pressed': on ? 'true' : 'false', onclick: () => { picks[e.n] = n; draw(false); } }, n);
        })))));
      draw(false);
      const btn = h('button', { type: 'button', class: 'btn pri full', onclick: () => {
        const hits = er.ents.filter((e) => picks[e.n] === keyOf(e)).length;
        scores.push(hits / er.ents.length);
        draw(true);
        btn.remove();
        fb.replaceChildren(caption(hits === er.ents.length ? '**Alle Schlüssel richtig.** Im Diagramm werden sie unterstrichen.' : 'Namen, Daten und Status sind selten eindeutig. Ergänze deshalb eine künstliche ID, das erlaubt die Aufgabe ausdrücklich. Im Diagramm wird sie unterstrichen.', hits === er.ents.length ? 'ok' : 'warn'), h('button', { type: 'button', class: 'btn pri full', onclick: stepCards }, 'Weiter: Beziehungen'));
      } }, 'Prüfen');
      area.replaceChildren(h('span', { class: 'pill exam' }, 'Schritt 2 von 3: Schlüsselattribute'), h('p', null, 'Welches Attribut identifiziert jede Entität eindeutig?'), list, btn, fb);
    };

    const stepCards = () => {
      const ans = {};
      const list = h('div', { class: 'stack' });
      const fb = h('div');
      const right = (r) => [r.ca === '1' ? '1' : 'N', r.cb === '1' ? '1' : 'N'];
      const draw = (checked) => list.replaceChildren(...er.rels.map((r, i) => {
        ans[i] = ans[i] || [null, null];
        const seg = (side) => {
          const sol = right(r)[side];
          return h('div', { class: 'chips' }, ['1', 'N'].map((v) => {
            const on = ans[i][side] === v;
            const cls = checked ? (sol === v ? ' ok' : on ? ' bad' : '') : on ? ' on' : '';
            return h('button', { type: 'button', class: 'chip' + cls, disabled: checked, 'aria-pressed': on ? 'true' : 'false', onclick: () => { ans[i][side] = v; draw(false); } }, v === 'N' ? 'viele' : '1');
          }));
        };
        return h('div', { class: 'stack-s', style: 'padding:9px 0;border-top:1px solid var(--line)' },
          rich(r.text, 'prose small'),
          h('div', { class: 'row wrap', style: 'gap:6px 12px' },
            h('b', { class: 'small' }, r.a), seg(0),
            h('span', { class: 'small muted', style: 'font-style:italic' }, r.n),
            seg(1), h('b', { class: 'small' }, r.b)));
      }));
      draw(false);
      const btn = h('button', { type: 'button', class: 'btn pri full', onclick: () => {
        let hits = 0;
        er.rels.forEach((r, i) => { if (ans[i][0] === right(r)[0] && ans[i][1] === right(r)[1]) hits++; });
        scores.push(hits / er.rels.length);
        draw(true);
        btn.remove();
        fb.replaceChildren(caption(hits === er.rels.length ? '**Alle Kardinalitäten richtig.**' : 'Lies jeden Satz von beiden Seiten: „Wie viele B hat ein A?“ und „Wie viele A hat ein B?“. Die Zahl steht in Chen-Notation an der gegenüberliegenden Entität. Beispiel: Eine Sorte hat viele Chargen, also steht das N bei Charge.', hits === er.rels.length ? 'ok' : 'warn'), h('button', { type: 'button', class: 'btn pri full', onclick: finish }, 'Diagramm zeichnen'));
      } }, 'Prüfen');
      area.replaceChildren(h('span', { class: 'pill exam' }, 'Schritt 3 von 3: Beziehungen und Kardinalitäten'), h('p', null, 'Wie viele Partner hat jede Seite? Zwei Mal „viele“ ergibt N:M.'), list, btn, fb);
    };

    const finish = () => {
      const total = scores.reduce((s, x) => s + x, 0) / scores.length;
      area.replaceChildren(
        caption('Dein Ergebnis: **' + Math.round(total * 100) + ' %**. So sieht das fertige Diagramm aus. Zeichne es jetzt einmal von Hand, denn in der Klausur brauchst du es auf Papier.', total >= 0.8 ? 'ok' : 'warn'),
        ER.block({ er, anim: true, title: 'Musterlösung in Chen-Notation' }));
      if (api && api.done) api.done(total);
    };
    host.append(vizCard(sc.title ? 'ER-Modell: ' + sc.title : 'ER-Modell', area));
    stepEntities();
  };

  // ---------------------------------------------------------------------------
  // ER → Relationen: für jede Beziehung entscheiden, wo der Fremdschlüssel hinkommt.
  Labs.er2rm = function (host, params, api) {
    const er = params.er;
    const area = h('div', { class: 'stack' });
    const schema = ERM.toSchema(er);
    let i = 0;
    let hits = 0;
    const linkName = (r) => r.table || r.a + '_' + r.b;
    const next = () => {
      if (i >= er.rels.length) {
        const score = er.rels.length ? hits / er.rels.length : 1;
        area.replaceChildren(
          caption(hits + ' von ' + er.rels.length + ' Entscheidungen richtig. So sieht das vollständige Schema in der Notation der Vorlesung aus:', score >= 0.8 ? 'ok' : 'warn'),
          h('div', { class: 'stack-s' }, schema.map((s) => h('div', { class: 'schema fade-in', html: md(s.line) }))),
          caption('Primärschlüssel unterstrichen, Fremdschlüssel vollqualifiziert, Datentypen angegeben. Genau das verlangt die Klausur.'));
        if (api && api.done) api.done(score);
        return;
      }
      const r = er.rels[i];
      const many = r.ca !== '1' && r.cb !== '1';
      const oneOne = r.ca === '1' && r.cb === '1';
      const options = [
        { id: 'a', label: 'Fremdschlüssel in ' + r.a, ok: oneOne || (r.ca !== '1' && r.cb === '1') },
        { id: 'b', label: 'Fremdschlüssel in ' + r.b, ok: oneOne || (r.ca === '1' && r.cb !== '1') },
        { id: 'c', label: 'Eigene Tabelle ' + linkName(r), ok: many }
      ];
      const why = many ? 'N:M braucht eine **Verknüpfungstabelle**. Ihr Primärschlüssel besteht aus beiden Fremdschlüsseln, so kann jedes Paar nur einmal vorkommen.' : oneOne ? 'Bei 1:1 darf der Fremdschlüssel auf einer der beiden Seiten stehen, zusätzlich **UNIQUE**. So kann jeder Wert nur einmal vorkommen.' : 'Der Fremdschlüssel steht auf der Seite mit **„viele“**. Stünde er auf der anderen Seite, müsste man Zeilen verdoppeln.';
      const fb = h('div');
      const buttons = h('div', { class: 'stack-s' });
      const drawButtons = (picked) => buttons.replaceChildren(...options.map((o) => {
        let cls = 'opt';
        if (picked) cls += o.ok ? ' ok' : o === picked ? ' bad' : '';
        return h('button', { type: 'button', class: cls, disabled: !!picked, onclick: () => {
          if (o.ok) hits++;
          drawButtons(o);
          fb.replaceChildren(caption((o.ok ? '**Richtig.** ' : '**Nicht ganz.** ') + why, o.ok ? 'ok' : 'bad'), h('button', { type: 'button', class: 'btn pri full', onclick: () => { i++; next(); } }, i + 1 < er.rels.length ? 'Nächste Beziehung' : 'Fertiges Schema zeigen'));
        } }, icon(picked ? (o.ok ? 'check' : o === picked ? 'cross' : 'circle') : 'circle'), h('span', null, o.label));
      }));
      drawButtons(null);
      area.replaceChildren(
        h('div', { class: 'row' }, h('span', { class: 'pill exam num' }, 'Beziehung ' + (i + 1) + ' von ' + er.rels.length)),
        h('div', { class: 'formula' }, r.a + '  ' + r.ca + ' — ' + r.n + ' — ' + r.cb + '  ' + r.b),
        h('p', null, 'Wie bildest du diese Beziehung ab?'),
        buttons, fb);
    };
    host.append(vizCard(params.title ? 'Schema: ' + params.title : 'Vom ER-Diagramm zum Schema', ER.figure(er), area));
    next();
  };

  // ---------------------------------------------------------------------------
  Labs.fkrules = function (host) {
    const K0 = [['1', 'Huber'], ['2', 'Müller'], ['3', 'Pohl']];
    const Q0 = [['101', '1', '80,00'], ['102', '2', '400,00'], ['103', '2', '310,00'], ['104', '3', '80,00']];
    const stage = h('div', { class: 'stack' });
    const RULES = {
      restrict: { label: 'RESTRICT', sql: 'ON DELETE RESTRICT' },
      cascade: { label: 'CASCADE', sql: 'ON DELETE CASCADE' },
      setnull: { label: 'SET NULL', sql: 'ON DELETE SET NULL' }
    };
    let rule = 'restrict';
    const tables = (k, q, opts) => relGroup([
      { title: 'Vaterrelation Kunde', head: ['<u>KundenNr</u>', 'Name'], rows: k, bad: opts && opts.badK },
      { title: 'Abhängige Relation Rechnung', head: ['<u>ReNr</u>', 'KundenNr', 'Betrag'], rows: q, hl: opts && opts.hlQ, bad: opts && opts.badQ }
    ]);
    const initial = () => stage.replaceChildren(tables(K0, Q0, { hlQ: [1, 2] }), caption('Kunde 2 (Müller) hat zwei Rechnungen. Was passiert beim Löschen? Das entscheidet die Regel beim Fremdschlüssel.\n`FOREIGN KEY (KundenNr) REFERENCES Kunde(KundenNr) ' + RULES[rule].sql + '`'),
      h('button', { type: 'button', class: 'btn pri full', onclick: del }, 'DELETE FROM Kunde WHERE KundenNr = 2'));
    const del = () => {
      let body;
      if (rule === 'restrict') body = [tables(K0, Q0, { badQ: [1, 2], badK: [1] }), caption('**Abgelehnt.** Solange ein Fremdschlüssel auf das Tupel verweist, kann der Kunde nicht gelöscht werden.', 'bad')];
      else if (rule === 'cascade') body = [tables(K0.filter((r) => r[0] !== '2'), Q0.filter((r) => r[1] !== '2')), caption('**Mitgelöscht.** Mit dem Kunden verschwinden auch seine Rechnungen.', 'warn')];
      else body = [tables(K0.filter((r) => r[0] !== '2'), Q0.map((r) => (r[1] === '2' ? [r[0], 'NULL', r[2]] : r)), { hlQ: [1, 2] }), caption('**Auf NULL gesetzt.** Die Rechnungen bleiben erhalten, aber ohne Kunde. Das geht nur, wenn die Spalte NULL erlaubt. SET DEFAULT setzt stattdessen einen festgelegten Standardwert.', 'warn')];
      stage.replaceChildren(...body, h('button', { type: 'button', class: 'btn line full', onclick: initial }, 'Zurücksetzen'));
    };
    host.append(vizCard('Labor: Löschregeln beim Fremdschlüssel',
      segmented(Object.entries(RULES).map(([id, r]) => ({ id, label: r.label })), rule, (id) => { rule = id; initial(); }), stage));
    initial();
  };
})();
</script><script>// Fragetypen und Übungssitzung (entspricht Views/QuestionViews.swift).
// Typen: mc, ms, tf, num, ord, match, open und lab (interaktives Labor mit Punktewertung).
(function () {
  'use strict';

  const shuffle = (a) => DBEngine.Calc.shuffle(a);

  window.freshDraft = function (q) {
    const d = { selected: [], tf: {}, numText: '', order: [], match: {}, openText: '', openChecks: [], labScore: null, optionOrder: [], matchChoices: [] };
    const idx = (q.o || []).map((_, i) => i);
    d.optionOrder = q.keep ? idx : shuffle(idx);
    let seq = shuffle(q.seq || []);
    if (q.seq && seq.join('|') === q.seq.join('|') && seq.length > 1) seq = seq.slice().reverse();
    d.order = seq;
    d.matchChoices = shuffle(Array.from(new Set((q.pairs || []).map((p) => p[1]))));
    return d;
  };

  const parseNum = (s) => {
    let t = String(s).trim().replace(/\s/g, '');
    if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
    const v = parseFloat(t);
    return Number.isFinite(v) ? v : null;
  };

  window.scoreDraft = function (q, d) {
    switch (q.k) {
      case 'mc':
        return d.selected[0] === (q.a || [])[0] ? 1 : 0;
      case 'ms': {
        const correct = q.a || [];
        if (!correct.length) return 0;
        const hits = d.selected.filter((x) => correct.includes(x)).length;
        const misses = d.selected.filter((x) => !correct.includes(x)).length;
        return Math.max(0, (hits - misses) / correct.length);
      }
      case 'tf': {
        const st = q.st || [];
        if (!st.length) return 0;
        return st.filter((s, i) => d.tf[i] === s.v).length / st.length;
      }
      case 'num': {
        const v = parseNum(d.numText);
        return v !== null && Math.abs(v - q.num) <= (q.tol === undefined ? 0.01 : q.tol) ? 1 : 0;
      }
      case 'ord': {
        const sol = q.seq || [];
        if (!sol.length) return 0;
        return d.order.filter((x, i) => sol[i] === x).length / sol.length;
      }
      case 'match': {
        const pairs = q.pairs || [];
        if (!pairs.length) return 0;
        return pairs.filter((p, i) => d.match[i] === p[1]).length / pairs.length;
      }
      case 'open': {
        const pts = q.model || [];
        return pts.length ? d.openChecks.length / pts.length : 0;
      }
      case 'lab':
        return d.labScore === null ? 0 : d.labScore;
      default:
        return 0;
    }
  };

  const isAnswered = (q, d) => {
    switch (q.k) {
      case 'mc': case 'ms': return d.selected.length > 0;
      case 'tf': return Object.keys(d.tf).length === (q.st || []).length;
      case 'num': return d.numText.trim() !== '';
      case 'ord': case 'open': return true;
      case 'match': return Object.keys(d.match).length > 0;
      case 'lab': return d.labScore !== null;
      default: return false;
    }
  };
  window.isAnswered = isAnswered;

  const KIND = { mc: 'Einfachauswahl', ms: 'Mehrfachauswahl', tf: 'Richtig oder falsch?', num: 'Rechenaufgabe', ord: 'Reihenfolge', match: 'Zuordnung', open: 'Offene Frage', lab: 'Interaktive Aufgabe' };

  function srcLabel(src) {
    if (!src) return null;
    if (src === 'klausurnah') return h('span', { class: 'pill exam' }, 'klausurnah');
    if (src === 'trainer') return h('span', { class: 'pill' }, 'Zufallsaufgabe');
    return h('span', { class: 'pill' }, src);
  }

  window.questionHeader = function (q) {
    const dots = '●'.repeat(q.lvl || 1) + '○'.repeat(3 - (q.lvl || 1));
    return h('div', { class: 'stack-s' },
      h('div', { class: 'q-head' }, h('span', null, KIND[q.k] || ''), srcLabel(q.src), h('span', { class: 'dots3', 'aria-label': 'Schwierigkeit ' + (q.lvl || 1) + ' von 3' }, dots), h('span', { class: 'muted num' }, (q.pts || 0) + ' P.')),
      rich(q.q, 'q-text'));
  };

  window.questionInput = function (q, draft, opts) {
    const o = opts || {};
    const locked = !!o.locked;
    const show = !!o.showSolution;
    const changed = () => o.onChange && o.onChange();
    const box = h('div', { class: 'stack-s' });

    const draw = () => {
      box.replaceChildren();
      if (q.k === 'mc' || q.k === 'ms') {
        const correct = q.a || [];
        if (q.k === 'ms') box.append(h('div', { class: 'small muted' }, 'Mehrere Antworten können richtig sein.'));
        const compact = q.keep && (q.o || []).every((x) => x.length < 18);
        const list = h('div', { class: compact ? 'opts-grid' : 'stack-s' });
        for (const i of draft.optionOrder) {
          const sel = draft.selected.includes(i);
          let cls = 'opt';
          let ic = q.k === 'ms' ? (sel ? 'checksq' : 'square') : sel ? 'dot' : 'circle';
          if (show) {
            if (correct.includes(i)) { cls += ' ok'; ic = 'check'; }
            else if (sel) { cls += ' bad'; ic = 'cross'; }
          } else if (sel) cls += ' on';
          list.append(h('button', {
            type: 'button', class: cls, disabled: locked, 'aria-pressed': sel ? 'true' : 'false',
            onclick: () => {
              if (q.k === 'mc') draft.selected = [i];
              else draft.selected = sel ? draft.selected.filter((x) => x !== i) : draft.selected.concat(i);
              draw();
              changed();
            }
          }, icon(ic), h('span', { html: md(q.o[i]) })));
        }
        box.append(list);
      } else if (q.k === 'tf') {
        (q.st || []).forEach((s, i) => {
          const btn = (val, label) => {
            const on = draft.tf[i] === val;
            let cls = on ? 'on' : '';
            if (show) cls = s.v === val ? 'ok' : on ? 'bad' : '';
            return h('button', { type: 'button', class: cls || undefined, disabled: locked, 'aria-pressed': on ? 'true' : 'false', onclick: () => { draft.tf[i] = val; draw(); changed(); } }, label);
          };
          box.append(h('div', { class: 'tf' },
            rich(s.s, 'prose'),
            h('div', { class: 'pair' }, btn(true, 'Richtig'), btn(false, 'Falsch')),
            show && s.e ? rich(s.e, 'small muted') : null));
        });
      } else if (q.k === 'num') {
        const input = h('input', {
          type: 'text', inputmode: 'decimal', id: 'num-' + q.id, 'aria-label': 'Ergebnis', placeholder: 'Ergebnis', value: draft.numText, disabled: locked,
          class: show ? (scoreDraft(q, draft) >= 0.999 ? 'ok' : 'bad') : undefined,
          oninput: (e) => { draft.numText = e.target.value; changed(); }
        });
        box.append(h('div', { class: 'row' }, h('div', { class: 'grow' }, input), q.unit ? h('b', { class: 'muted' }, q.unit) : null));
        if (show) box.append(h('b', { style: 'color:var(--good)' }, 'Lösung: ' + String(q.num).replace('.', ',') + (q.unit ? ' ' + q.unit : '')));
      } else if (q.k === 'ord') {
        const sol = q.seq || [];
        draft.order.forEach((item, i) => {
          const right = sol[i] === item;
          box.append(h('div', { class: 'ord-item' },
            h('span', { class: 'n' }, String(i + 1)),
            h('span', { html: md(item) }),
            locked
              ? (show ? h('span', { style: 'color:var(--' + (right ? 'good' : 'bad') + ');width:22px' }, icon(right ? 'check' : 'cross')) : h('span'))
              : h('span', { class: 'row', style: 'gap:4px' },
                  h('button', { type: 'button', 'aria-label': 'Nach oben', disabled: i === 0, onclick: () => { [draft.order[i - 1], draft.order[i]] = [draft.order[i], draft.order[i - 1]]; draw(); changed(); } }, icon('up')),
                  h('button', { type: 'button', 'aria-label': 'Nach unten', disabled: i === draft.order.length - 1, onclick: () => { [draft.order[i + 1], draft.order[i]] = [draft.order[i], draft.order[i + 1]]; draw(); changed(); } }, icon('down')))));
        });
        if (show) {
          box.append(h('div', { class: 'caption ok small' }, h('b', null, 'Richtige Reihenfolge'), h('ol', { style: 'margin:4px 0 0;padding-left:20px' }, sol.map((x) => h('li', { html: md(x) })))));
        }
      } else if (q.k === 'match') {
        (q.pairs || []).forEach((p, i) => {
          const sel = h('select', {
            id: 'm-' + q.id + '-' + i, 'aria-label': 'Zuordnung', disabled: locked,
            class: show ? (draft.match[i] === p[1] ? 'ok' : 'bad') : undefined,
            onchange: (e) => { if (e.target.value) draft.match[i] = e.target.value; else delete draft.match[i]; changed(); }
          }, h('option', { value: '' }, 'Auswählen …'), draft.matchChoices.map((c) => h('option', { value: c, selected: draft.match[i] === c ? true : undefined }, c.replace(/\*\*/g, ''))));
          box.append(h('div', { class: 'match-row' }, rich(p[0], 'prose'), sel,
            show && draft.match[i] !== p[1] ? h('div', { class: 'small', style: 'color:var(--good)', html: md('Richtig: ' + p[1]) }) : null,
            show && p[2] ? rich(p[2], 'small muted') : null));
        });
      } else if (q.k === 'open') {
        box.append(h('textarea', { id: 'o-' + q.id, 'aria-label': 'Deine Antwort', placeholder: 'Deine Antwort (Stichpunkte reichen). Für Diagramme: auf Papier zeichnen.', disabled: locked && !show, oninput: (e) => { draft.openText = e.target.value; } }, draft.openText));
        if (show) {
          box.append(h('div', { class: 'small muted' }, 'Vergleiche mit der Musterlösung und hake ab, was du hattest:'));
          (q.model || []).forEach((pt, i) => {
            const on = draft.openChecks.includes(i);
            box.append(h('button', { type: 'button', class: 'check-item' + (on ? ' on' : ''), 'aria-pressed': on ? 'true' : 'false', onclick: () => { draft.openChecks = on ? draft.openChecks.filter((x) => x !== i) : draft.openChecks.concat(i); draw(); changed(); } }, icon(on ? 'checksq' : 'square'), h('span', { html: md(pt) })));
          });
        }
      } else if (q.k === 'lab') {
        if (!draft.labHost) {
          draft.labHost = h('div', { class: 'lab-host' });
          const fn = window.DBLabs[q.viz];
          if (fn) fn(draft.labHost, q.params || {}, { done: (score) => { draft.labScore = score; changed(); } });
          if (q.params && q.params.autoDone) draft.labScore = 1;
          else draft.labHost.append(caption('Labor „' + q.viz + '“ fehlt.', 'bad'));
        }
        box.append(draft.labHost);
      }
    };
    draw();
    return box;
  };

  window.solutionPanel = function (q, score) {
    const items = [];
    if (q.k !== 'open') {
      const state = score >= 0.999 ? ['ok', 'check', 'Richtig!'] : score > 0 ? ['part', 'half', 'Teilweise richtig'] : ['bad', 'cross', 'Noch nicht richtig'];
      items.push(h('div', { class: 'sol-head ' + state[0] }, icon(state[1]), h('span', null, state[2])));
    }
    if (q.steps && q.steps.length) {
      items.push(h('div', { class: 'stack-s' }, h('div', { class: 'eyebrow' }, 'Lösungsweg'), h('ol', { class: 'steps' }, q.steps.map((s) => h('li', null, h('span', { html: md(s) }))))));
    }
    if (q.e) items.push(rich(q.e, 'prose'));
    if (q.sol) items.push(renderBlocks(q.sol));
    if (q.ref) items.push(h('div', { class: 'ref' }, 'Nachlesen: ' + refLabel(q.ref)));
    return h('div', { class: 'card stack fade-in', role: 'status' }, items);
  };

  // Eine Sitzung läuft wie in der App: falsche Aufgaben kommen einmal wieder.
  window.runSession = function (host, cfg) {
    const queue = cfg.questions.slice();
    const requeued = new Set();
    const wrong = new Set();
    let index = 0;
    let total = 0;
    let max = 0;
    let finished = false;

    const apply = (q, d) => {
      const s = scoreDraft(q, d);
      total += s * (q.pts || 1);
      max += q.pts || 1;
      const rating = s >= 0.999 ? 'good' : s >= 0.5 ? 'hard' : 'wrong';
      Store.record(q.id, rating);
      if (rating === 'wrong') {
        wrong.add(q.id);
        if (!requeued.has(q.id) && q.k !== 'lab' && q.k !== 'open') {
          requeued.add(q.id);
          queue.push(q);
        }
      }
    };

    const showSummary = () => {
      finished = true;
      const ratio = max ? total / max : 0;
      host.replaceChildren(
        h('div', { class: 'card stack fade-in', style: 'align-items:center;text-align:center' },
          h('div', { style: 'position:relative;width:128px;height:128px' }, ring(ratio, 128, ratio >= 0.5 ? 'var(--good)' : 'var(--warn)', 12), h('b', { style: 'position:absolute;inset:0;display:grid;place-items:center;font-size:1.6rem' }, Math.round(ratio * 100) + ' %')),
          h('h2', null, cfg.questions.length ? 'Sitzung abgeschlossen' : 'Gerade ist nichts zu tun.'),
          cfg.questions.length ? h('div', { class: 'muted num' }, total.toFixed(1).replace('.', ',') + ' von ' + max + ' Punkten') : null,
          wrong.size ? h('div', { class: 'small', style: 'color:var(--warn)' }, wrong.size + (wrong.size === 1 ? ' Aufgabe kommt' : ' Aufgaben kommen') + ' bald in der Wiederholung wieder.') : null,
          cfg.finish ? cfg.finish() : null));
      window.scrollTo({ top: 0 });
    };

    const showQuestion = () => {
      const q = queue[index];
      const d = freshDraft(q);
      let revealed = false;
      const headCard = h('div', { class: 'card stack' }, questionHeader(q), q.fig ? renderBlock(q.fig) : null);
      const inputCard = h('div', { class: q.k === 'lab' ? 'stack' : 'card stack' });
      const after = h('div', { class: 'stack' });
      const action = h('div');

      const drawInput = () => {
        inputCard.replaceChildren(questionInput(q, d, {
          locked: revealed && q.k !== 'open',
          showSolution: revealed,
          onChange: () => { drawAction(); }
        }));
      };
      const drawAction = () => {
        if (!revealed) {
          const answered = isAnswered(q, d);
          const label = q.k === 'open' ? 'Musterlösung zeigen' : q.k === 'lab' ? (answered ? 'Auswerten' : 'Erst die Aufgabe lösen') : 'Prüfen';
          action.replaceChildren(h('button', {
            type: 'button', class: 'btn pri full', disabled: !answered,
            onclick: () => {
              revealed = true;
              if (q.k !== 'open') apply(q, d);
              if (q.k !== 'lab') drawInput();
              after.replaceChildren(solutionPanel(q, scoreDraft(q, d)));
              drawAction();
            }
          }, label));
        } else {
          action.replaceChildren(h('button', {
            type: 'button', class: 'btn pri full',
            onclick: () => {
              if (q.k === 'open') apply(q, d);
              if (index + 1 < queue.length) {
                index++;
                showQuestion();
                window.scrollTo({ top: 0 });
              } else showSummary();
            }
          }, index + 1 < queue.length ? 'Weiter' : 'Abschließen'));
        }
      };
      drawInput();
      drawAction();
      host.replaceChildren(
        h('div', { class: 'row small muted' }, h('div', { class: 'grow bar' }, h('i', { style: 'width:' + (index / Math.max(queue.length, 1)) * 100 + '%' })), h('span', { class: 'num' }, index + 1 + '/' + queue.length)),
        headCard, inputCard, after, action);
    };

    if (!queue.length) showSummary();
    else showQuestion();
    return { get finished() { return finished; } };
  };
})();
</script><script>// Brücke für die iOS-App: WKWebView ruft renderFromNative(json) auf und bekommt Höhe und Punkte zurück.
(function () {
  'use strict';
  const post = (msg) => {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lab) {
      window.webkit.messageHandlers.lab.postMessage(msg);
    }
  };
  const reportHeight = () => post({ height: document.documentElement.scrollHeight });
  new ResizeObserver(reportHeight).observe(document.documentElement);

  // block: ein Inhaltsblock (x, er, st ...); question: eine Frage vom Typ lab.
  window.renderFromNative = function (json) {
    const payload = typeof json === 'string' ? JSON.parse(json) : json;
    const host = document.getElementById('host');
    host.replaceChildren();
    if (payload.k === 'lab') {
      window.DBLabs[payload.viz](host, payload.params || {}, { done: (score) => post({ score }) });
    } else {
      host.append(window.renderBlock(payload));
    }
    reportHeight();
  };
  post({ ready: true });
})();
</script></body></html>
